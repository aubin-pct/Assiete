<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assiette</title>
<meta name="theme-color" content="#F4F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B100D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assiette">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F4F5F0; --surface:#FFFFFF; --sunk:#ECEEE7; --ink:#131A16; --muted:#667069; --line:rgba(19,26,22,.09);
  --accent:#0F7A55; --accent2:#17936A; --accent-ink:#FFFFFF; --accent-soft:#DDF0E6;
  --grad:linear-gradient(135deg,var(--accent2),var(--accent));
  --prot:#B8472E; --carb:#B07C12; --fat:#3868A0; --danger:#C0392B;
  --shadow:0 1px 2px rgba(19,26,22,.05),0 12px 32px -16px rgba(19,26,22,.22);
  --radius:26px; --r-md:18px;
  --display:"Sora", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B100D; --surface:#141B17; --sunk:#1C2520; --ink:#E9EFEB; --muted:#98A59C; --line:rgba(255,255,255,.08);
    --accent:#3FBF8D; --accent2:#66E0B0; --accent-ink:#06140D; --accent-soft:#173428;
    --prot:#E07A5F; --carb:#E0B040; --fat:#7AA7DA; --danger:#EE7B67;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 32px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0px) 16px calc(124px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent)}
svg{flex:none}

/* entrée des écrans */
#app.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
#app.enter>*:nth-child(2){animation-delay:.05s}
#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}
#app.enter>*:nth-child(5){animation-delay:.2s}
#app.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#app.enter .ring .val{animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) .1s backwards}
@keyframes ringin{from{stroke-dashoffset:100}}

/* en-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
.title{font-family:var(--display);font-size:1.8rem;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.sub b{color:var(--accent);font-weight:600}
.daybtn{border:none;background:none;padding:0;text-align:left;min-width:0}
.stepper{display:flex;gap:2px;padding:4px;background:var(--surface);border-radius:99px;box-shadow:var(--shadow);flex:none}
.stepper button{width:42px;height:42px;border:none;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.stepper button:active:not(:disabled){background:var(--sunk)}
.stepper button:disabled{opacity:.3}
.stepper svg{width:20px;height:20px}

/* résumé */
.summary{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px 20px;display:flex;flex-direction:column;gap:22px}
.summary::before{content:"";position:absolute;top:-90px;right:-70px;width:280px;height:280px;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.summary>*{position:relative}
.hero{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .track{stroke:var(--sunk)}
.ring .val{stroke:url(#rg);stroke-linecap:round}
.ring.over .val{stroke:var(--danger)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:2.05rem;font-weight:700;line-height:1;letter-spacing:-.03em}
.rest{display:flex;flex-direction:column;gap:2px;min-width:0}
.rest b{font-family:var(--display);font-size:1.9rem;line-height:1.1;letter-spacing:-.02em}
.rest.over b{color:var(--danger)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--sunk);border-radius:var(--r-md);padding:12px}
.macro .lbl{display:flex;align-items:center;gap:6px}
.macro .lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.macro.p .lbl{color:var(--prot)}.macro.c .lbl{color:var(--carb)}.macro.f .lbl{color:var(--fat)}
.macro .val{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.macro .val small{font-weight:500;color:var(--muted);font-family:var(--body);font-size:.72rem;letter-spacing:0;display:block;margin-top:1px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.p .bar>span,.chip.p::before{background:var(--prot)}
.c .bar>span,.chip.c::before{background:var(--carb)}
.f .bar>span,.chip.f::before{background:var(--fat)}
.bar.over>span{background:var(--danger)}

/* repas */
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 4px 0}
.meals{display:flex;flex-direction:column;gap:12px}
.meal{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.mrow{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px;width:100%;border:none;background:none;text-align:left}
.thumb{width:64px;height:64px;border-radius:18px;object-fit:cover;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:26px;height:26px}
.minfo{min-width:0}
.name{font-weight:600;font-size:1.02rem;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:.8rem;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.chip{font-size:.78rem;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.chip::before{content:"";width:7px;height:7px;border-radius:50%}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.kc{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em;line-height:1.1}
.kcu{font-size:.72rem;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted);margin-top:6px;transition:transform .25s}
.mrow[aria-expanded=true] .chev{transform:rotate(180deg)}
.mpanel{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;animation:rise .3s ease-out}
.mitems{display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.mitems .li{display:flex;justify-content:space-between;gap:12px}
.mitems .li span:first-child{overflow-wrap:anywhere}
.mitems .li span:last-child{white-space:nowrap}
.mact{display:flex;gap:8px;flex-wrap:wrap}
.mact .btn{flex:1 1 140px}
.empty{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 20px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .orb{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.empty .orb svg{width:38px;height:38px}
.empty b{font-family:var(--display);font-size:1.15rem}
.empty .btn{margin-top:14px;align-self:stretch}

/* formulaires */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
label.f,.fl{display:flex;flex-direction:column;gap:7px;font-size:.85rem;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{width:100%;border:none;background:var(--sunk);border-radius:14px;padding:13px 14px;font-size:16px;color:var(--ink)}
::placeholder{color:var(--muted);opacity:.75}
textarea{resize:vertical;min-height:76px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--sunk);border-radius:16px}
.seg button{border:none;background:none;border-radius:12px;padding:0 2px;min-height:42px;font-size:.82rem;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.link{border:none;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline}
.pw{display:flex;gap:8px}
.pw .btn{flex:none;min-height:48px;padding:0 16px}
.btn{border:none;border-radius:18px;padding:0 20px;min-height:54px;font-weight:600;background:var(--grad);color:var(--accent-ink);font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 12px 22px -12px var(--accent);transition:transform .12s,opacity .2s}
.btn svg{width:20px;height:20px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.ghost{background:var(--sunk);color:var(--ink);box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);box-shadow:none}
.btn.danger.armed{background:var(--danger);color:var(--accent-ink)}
.btn.sm{min-height:44px;padding:0 16px;font-size:.9rem;border-radius:14px}
.btn:disabled{opacity:.4;box-shadow:none}
.textbtn{border:none;background:none;color:var(--muted);font-weight:600;font-size:.9rem;padding:10px;align-self:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.95rem;font-weight:600;background:var(--sunk);border-radius:16px;padding:12px 14px}
.switch small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.switch input{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:50px;height:30px;margin:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}

/* prise de photo */
.cap{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cap::before{content:"";position:absolute;top:-80px;left:50%;width:340px;height:340px;margin-left:-170px;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.cap>*{position:relative}
.captitle{font-family:var(--display);font-size:1.2rem;letter-spacing:-.01em}
.shutter{position:relative;width:92px;height:92px;border-radius:50%;background:var(--grad);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:12px;cursor:pointer;box-shadow:0 0 0 9px var(--accent-soft),0 18px 32px -12px var(--accent)}
.shutter::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent2);animation:pulse 2.6s ease-out infinite;pointer-events:none}
@keyframes pulse{from{transform:scale(1.1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.shutter svg{width:40px;height:40px}
.shutter input,.pill input,.glass input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pills{display:flex;gap:10px;width:100%;margin-top:14px}
.pill{flex:1;position:relative;overflow:hidden;min-height:48px;border:none;border-radius:99px;background:var(--sunk);color:var(--ink);font-weight:600;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:pointer}
.pill svg{width:19px;height:19px}
.photo{position:relative;overflow:hidden;border-radius:var(--radius);box-shadow:var(--shadow);aspect-ratio:4/3;background:var(--sunk)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 62%,transparent);color:var(--bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.photo .x svg{width:20px;height:20px}
.overlay{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px}
.glass{flex:1;position:relative;overflow:hidden;min-height:44px;border-radius:99px;background:color-mix(in srgb,var(--ink) 62%,transparent);color:var(--bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:600;font-size:.88rem;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;cursor:pointer}
.glass svg{width:18px;height:18px}
.photo.busy::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent2);box-shadow:0 0 18px 5px var(--accent2);animation:scan 1.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes scan{to{top:calc(100% - 3px)}}

/* aliments */
#items{display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px}
.item .head{display:flex;gap:8px;align-items:center}
.item .head input{flex:1;font-weight:600}
.item .head .iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--muted)}
.item .head .iconbtn svg{width:18px;height:18px}
.item .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.item .grid label{display:flex;flex-direction:column;gap:4px;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;min-width:0}
.item .grid label:nth-child(3){color:var(--prot)}.item .grid label:nth-child(4){color:var(--carb)}.item .grid label:nth-child(5){color:var(--fat)}
.item .grid input{padding:10px 4px;text-align:center;font-variant-numeric:tabular-nums;border-radius:12px}
.savebar{position:sticky;bottom:calc(102px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:12px;padding:14px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:24px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.wrap:has(#items :focus) .savebar{position:static}
.totals{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;font-variant-numeric:tabular-nums;font-weight:600}
.totals b{font-family:var(--display);font-size:1.3rem;letter-spacing:-.02em}
.note{font-size:.9rem;background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.err{font-size:.9rem;color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);border-radius:16px;padding:12px 14px}
.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* historique */
.hread{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.hread b{display:block}
.hread b::first-letter{text-transform:uppercase}
.chartbox{position:relative}
.chart{height:140px;display:flex;align-items:flex-end;gap:5px}
.chart .col{flex:1;height:100%;min-width:0;display:flex;align-items:flex-end;border:none;background:none;padding:0}
.chart .col i{display:block;width:100%;min-height:4px;border-radius:8px;background:var(--accent);opacity:.32;transition:opacity .2s}
.chart .col.sel i{opacity:1;background:var(--grad)}
.chart .col.over i{background:var(--danger)}
.chart .col.none i{background:var(--sunk);opacity:1;height:4px}
.goalline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.7;pointer-events:none}
.days{display:flex;gap:5px}
.days span{flex:1;text-align:center;font-size:.72rem;color:var(--muted);font-weight:600}
.days .today{color:var(--accent);font-weight:700}
.wtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wbig{font-size:2.3rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.wbig small{font-size:1rem;font-weight:500;color:var(--muted);letter-spacing:0}
.spark{width:100%;height:72px;display:block}
.spark path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wlist{display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.wlist div{display:flex;justify-content:space-between;font-size:.92rem}

/* navigation flottante */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);width:min(536px,calc(100% - 24px));bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-radius:30px;box-shadow:var(--shadow),0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;z-index:10}
nav.tabs button{border:none;background:none;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0 7px;color:var(--muted);font-size:.68rem;font-weight:600;transition:background .2s,color .2s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .add span.plus{width:34px;height:34px;border-radius:50%;background:var(--grad);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 16px -8px var(--accent)}
nav.tabs .add span.plus svg{width:20px;height:20px}
nav.tabs .add[aria-current=page]{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:.9rem;font-weight:500;max-width:calc(100% - 32px);text-align:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="Navigation">
  <button data-view="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>Journal</button>
  <button data-view="add" class="add"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Ajouter</button>
  <button data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Historique</button>
  <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.6"/><circle cx="9" cy="17" r="2.6"/></svg>Réglages</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const KEY = "assiette.v1";
const DEFAULTS = {
  settings: { apiKey: "", baseUrl: "https://api.deepseek.com", model: "deepseek-flash", deep: false,
              goals: { kcal: 3000, p: 160, c: 380, f: 90 } },
  meals: [], weights: []
};
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
let S = load() || JSON.parse(JSON.stringify(DEFAULTS));
S.settings = Object.assign({}, DEFAULTS.settings, S.settings || {});
S.settings.goals = Object.assign({}, DEFAULTS.settings.goals, S.settings.goals || {});
S.meals = S.meals || []; S.weights = S.weights || [];
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast("Stockage plein : exporte tes données puis supprime d'anciens repas."); return false; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) && n > 0 ? n : 0; };
const r0 = n => Math.round(n);
const fmt = n => r0(n).toLocaleString("fr-FR");
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
const todayISO = () => iso(new Date());
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function shift(s, n){ const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function dayLabel(s){
  if (s === todayISO()) return "Aujourd'hui";
  if (s === shift(todayISO(), -1)) return "Hier";
  return parseISO(s).toLocaleDateString("fr-FR", { weekday:"short", day:"numeric", month:"short" });
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function dayTitle(s){
  const t = todayISO();
  if (s === t) return "Aujourd'hui";
  if (s === shift(t, -1)) return "Hier";
  return cap(parseISO(s).toLocaleDateString("fr-FR", { weekday:"long" }));
}
function daySub(s){
  const d = parseISO(s), t = todayISO();
  if (s === t || s === shift(t, -1)) return d.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
  return d.toLocaleDateString("fr-FR", d.getFullYear() === new Date().getFullYear() ? { day:"numeric", month:"long" } : { day:"numeric", month:"long", year:"numeric" });
}
function totals(items){
  return items.reduce((t,i) => ({ kcal:t.kcal+num(i.kcal), p:t.p+num(i.p), c:t.c+num(i.c), f:t.f+num(i.f) }), {kcal:0,p:0,c:0,f:0});
}
function dayTotals(date){
  return S.meals.filter(m => m.date === date).reduce((t,m) => {
    const x = totals(m.items); return { kcal:t.kcal+x.kcal, p:t.p+x.p, c:t.c+x.c, f:t.f+x.f };
  }, {kcal:0,p:0,c:0,f:0});
}
const pct = (v,g) => g > 0 ? Math.min(100, v/g*100) : 0;
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3200); }
function defaultType(){
  const h = new Date().getHours() + new Date().getMinutes()/60;
  if (h < 10.5) return "Petit-déjeuner";
  if (h < 15) return "Déjeuner";
  if (h < 18.5) return "Collation";
  return "Dîner";
}

/* ---------- icônes ---------- */
const ic = (body, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const CAM = ic(`<path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10.5H4z"/><circle cx="12" cy="13.5" r="3.6"/>`, 1.7);
const IMG = ic(`<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/>`);
const PEN = ic(`<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/>`);
const SPARK = ic(`<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>`);
const XI = ic(`<path d="M6 6l12 12M18 6L6 18"/>`, 2.2);
const PLATE = ic(`<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/>`, 1.5);
const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
const LEFT = ic(`<path d="M15 5l-7 7 7 7"/>`, 2.2), RIGHT = ic(`<path d="M9 5l7 7-7 7"/>`, 2.2);

/* ---------- state ---------- */
let view = "journal";
let curDate = todayISO();
let draft = newDraft();
let armedDelete = null, armT;
let openMeal = null;   // repas déplié dans le journal
let histSel = null;    // jour sélectionné dans le graphique d'historique
function newDraft(){ return { photo:null, thumb:null, note:"", type:defaultType(), items:[], name:"", hyp:"", conf:"", error:"", loading:false, analysed:false }; }
function arm(id){
  armedDelete = id; clearTimeout(armT);
  armT = setTimeout(() => { if (armedDelete === id){ armedDelete = null; render(); } }, 4000);
}

let enterT;
function animateIn(){
  const app = $("#app"); app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");
  clearTimeout(enterT); enterT = setTimeout(() => app.classList.remove("enter"), 1300);
}
function go(v){ view = v; armedDelete = null; render(); window.scrollTo(0,0); animateIn(); }
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.view === view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const app = $("#app");
  if (view === "journal") app.innerHTML = journalHTML();
  else if (view === "add") app.innerHTML = addHTML();
  else if (view === "history") app.innerHTML = historyHTML();
  else app.innerHTML = settingsHTML();
  bind();
}

/* ---------- journal ---------- */
function macroHTML(key, label, v, g){
  const over = g > 0 && v > g*1.1;
  return `<div class="macro ${key}"><div class="lbl">${label}</div>
    <div class="val num">${fmt(v)}<small>sur ${fmt(g)} g</small></div>
    <div class="bar${over ? " over" : ""}"><span style="width:${pct(v,g)}%"></span></div></div>`;
}
function ringHTML(v, g){
  const p = pct(v,g), over = g > 0 && v > g*1.1;
  return `<div class="ring${over ? " over" : ""}" role="img" aria-label="${fmt(v)} kcal sur ${fmt(g)}">
    <svg viewBox="0 0 148 148" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent2)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs>
      <circle class="track" cx="74" cy="74" r="66"/>${p > 0 ? `<circle class="val" cx="74" cy="74" r="66" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - p}"/>` : ""}</svg>
    <div class="in"><div class="big num">${fmt(v)}</div><div class="muted small">kcal</div></div></div>`;
}
function journalHTML(){
  const g = S.settings.goals, t = dayTotals(curDate), isToday = curDate === todayISO();
  const meals = S.meals.filter(m => m.date === curDate).sort((a,b) => a.time.localeCompare(b.time));
  const rest = g.kcal - t.kcal;
  const restHTML = rest >= 0
    ? `<div class="rest"><span class="lbl">Restantes</span><b class="num">${fmt(rest)}</b><span class="muted small">Objectif ${fmt(g.kcal)} kcal</span></div>`
    : `<div class="rest over"><span class="lbl">Au-dessus</span><b class="num">+${fmt(-rest)}</b><span class="muted small">Objectif ${fmt(g.kcal)} kcal</span></div>`;
  const list = meals.length ? meals.map(m => {
    const x = totals(m.items), open = openMeal === m.id, armed = armedDelete === m.id, armedP = armedDelete === "ph:" + m.id;
    return `<div class="meal">
      <button class="mrow" data-toggle="${m.id}" aria-expanded="${open}">
        ${m.thumb ? `<img class="thumb" src="${m.thumb}" alt="">` : `<div class="thumb">${PLATE}</div>`}
        <div class="minfo"><div class="name">${esc(m.name || m.type)}</div>
          <div class="meta">${esc(m.type)} · ${esc(m.time)}</div>
          <div class="chips"><span class="chip p">P ${fmt(x.p)} g</span><span class="chip c">G ${fmt(x.c)} g</span><span class="chip f">L ${fmt(x.f)} g</span></div></div>
        <div class="right"><span class="kc">${fmt(x.kcal)}</span><span class="kcu">kcal</span>${CHEV}</div>
      </button>
      ${open ? `<div class="mpanel">
        <div class="mitems">${m.items.map(i => `<div class="li"><span>${esc(i.nom)}</span><span class="muted num">${i.g ? fmt(i.g) + " g · " : ""}${fmt(i.kcal)} kcal</span></div>`).join("")}</div>
        <div class="mact">
          ${m.thumb ? `<button class="btn sm danger${armedP ? " armed" : ""}" data-delphoto="${m.id}">${armedP ? "Confirmer" : "Retirer la photo"}</button>` : ""}
          <button class="btn sm danger${armed ? " armed" : ""}" data-del="${m.id}">${armed ? "Confirmer" : "Supprimer le repas"}</button>
        </div></div>` : ""}
    </div>`;
  }).join("") : `<div class="empty"><div class="orb">${PLATE}</div>
      <b>${isToday ? "Ton assiette est vide" : "Rien ce jour-là"}</b>
      <span class="muted">${isToday ? "Photographie ton prochain repas pour commencer." : "Tu peux ajouter un repas à cette date."}</span>
      <button class="btn" data-go="add">${CAM}Ajouter un repas</button></div>`;
  return `
  <div class="top">
    <button class="daybtn" id="today" ${isToday ? "" : `aria-label="Revenir à aujourd'hui"`}><div class="title">${esc(dayTitle(curDate))}</div>
      <div class="sub">${esc(daySub(curDate))}${isToday ? "" : ` · <b>Aujourd'hui</b>`}</div></button>
    <div class="stepper"><button id="prev" aria-label="Jour précédent">${LEFT}</button>
      <button id="next" aria-label="Jour suivant" ${isToday ? "disabled" : ""}>${RIGHT}</button></div></div>
  <section class="summary">
    <div class="hero">${ringHTML(t.kcal, g.kcal)}${restHTML}</div>
    <div class="macros">${macroHTML("p","Protéines",t.p,g.p)}${macroHTML("c","Glucides",t.c,g.c)}${macroHTML("f","Lipides",t.f,g.f)}</div>
  </section>
  <div class="sect"><h2>Repas</h2>${meals.length ? `<span class="muted small">${meals.length} · touche pour le détail</span>` : ""}</div>
  <div class="meals">${list}</div>`;
}

/* ---------- add ---------- */
const TYPES = ["Petit-déjeuner","Déjeuner","Collation","Dîner"];
function itemHTML(it, i){
  const f = (k, lbl, step) => `<label>${lbl}<input type="number" inputmode="decimal" step="${step}" min="0" id="it-${i}-${k}" data-i="${i}" data-k="${k}" value="${it[k] ? r0(it[k]*10)/10 : ""}"></label>`;
  return `<div class="item">
    <div class="head"><input type="text" id="it-${i}-nom" data-i="${i}" data-k="nom" value="${esc(it.nom)}" placeholder="Aliment" aria-label="Nom de l'aliment">
      <button class="iconbtn" data-rm="${i}" aria-label="Retirer cet aliment">${XI}</button></div>
    <div class="grid">${f("g","Grammes","1")}${f("kcal","kcal","1")}${f("p","Prot.","0.1")}${f("c","Gluc.","0.1")}${f("f","Lip.","0.1")}</div>
  </div>`;
}
function totalsHTML(){
  const t = totals(draft.items);
  return `<span><b>${fmt(t.kcal)}</b> kcal</span><span style="color:var(--prot)">P ${fmt(t.p)} g</span><span style="color:var(--carb)">G ${fmt(t.c)} g</span><span style="color:var(--fat)">L ${fmt(t.f)} g</span>`;
}
const SHORT = { "Petit-déjeuner":"Petit-déj.", "Déjeuner":"Déjeuner", "Collation":"Collation", "Dîner":"Dîner" };
const canAnalyse = () => !draft.loading && !!S.settings.apiKey && !!(draft.photo || draft.note.trim());
// `capture` ouvre directement l'appareil photo arrière ; l'autre entrée ouvre la photothèque
const camInput = `<input type="file" id="photocam" accept="image/*" capture="environment">`;
const galInput = `<input type="file" id="photo" accept="image/*">`;
function captureHTML(showManual){
  return `<section class="cap">
    <label class="shutter" aria-label="Prendre une photo">${CAM}${camInput}</label>
    <b class="captitle">Photographie ton assiette</b>
    <span class="muted small">L'IA estime les aliments, les grammes et les macros.</span>
    <div class="pills"><label class="pill">${IMG}Galerie${galInput}</label>${showManual ? `<button class="pill" id="manual">${PEN}Saisie manuelle</button>` : ""}</div>
  </section>`;
}
function photoHTML(){
  const d = draft;
  return `<div class="photo${d.loading ? " busy" : ""}"><img src="${d.photo}" alt="Photo du repas">
    ${d.loading ? "" : `<button class="x" id="rmphoto" aria-label="Retirer la photo">${XI}</button>
    <div class="overlay"><label class="glass">${CAM}Reprendre${camInput}</label><label class="glass">${IMG}Galerie${galInput}</label></div>`}</div>`;
}
function addHTML(){
  const d = draft;
  const noKey = !S.settings.apiKey;
  const showManual = !d.analysed && !d.items.length;
  const result = (d.analysed || d.items.length) ? `
    <section class="card">
      <label class="f">Nom du repas<input type="text" id="mealname" value="${esc(d.name)}" placeholder="ex. Poulet riz brocolis"></label>
      ${d.hyp ? `<div class="note">${esc(d.hyp)}${d.conf ? ` <span class="muted">· confiance ${esc(d.conf)}</span>` : ""}</div>` : ""}
      <div class="muted small">Change les grammes : les calories et macros suivent automatiquement.</div>
    </section>
    <div id="items">${d.items.map(itemHTML).join("")}</div>
    <button class="btn ghost" id="additem">Ajouter un aliment</button>
    <div class="savebar">
      <div class="totals" id="totals">${totalsHTML()}</div>
      <button class="btn" id="savemeal" ${d.items.length ? "" : "disabled"}>Ajouter au journal · ${dayLabel(curDate)}</button>
    </div>` : "";
  return `
  <div class="top"><div><div class="title">Nouveau repas</div><div class="sub">Pour ${esc(dayLabel(curDate).toLowerCase())}</div></div></div>
  ${noKey ? `<div class="note">Pour l'analyse photo, il faut une clé API. <button class="link" data-go="settings">Ouvrir les Réglages</button>. La saisie manuelle marche sans clé.</div>` : ""}
  ${d.photo ? photoHTML() : captureHTML(showManual)}
  <section class="card">
    <div class="fl">Type de repas
      <div class="seg" role="radiogroup" aria-label="Type de repas">${TYPES.map(t => `<button type="button" role="radio" aria-checked="${t === d.type}" data-type="${t}">${SHORT[t]}</button>`).join("")}</div></div>
    <label class="f">Précisions (facultatif)<textarea id="note" placeholder="ex. 1 c. à s. d'huile d'olive, 200 g de riz cuit, sauce soja">${esc(d.note)}</textarea></label>
    <label class="switch"><span>Analyse approfondie<small>Plus lente, un peu plus précise</small></span><input type="checkbox" id="deep" ${S.settings.deep ? "checked" : ""}></label>
    ${d.error ? `<div class="err" role="alert">${esc(d.error)}</div>` : ""}
    <button class="btn" id="analyse" ${canAnalyse() ? "" : "disabled"}>${d.loading ? `<span class="spinner"></span>Analyse en cours` : `${SPARK}${d.analysed ? "Réanalyser" : "Analyser mon repas"}`}</button>
    ${d.loading ? `<div class="muted small" role="status" style="text-align:center">${S.settings.deep ? "Analyse approfondie : compte jusqu'à une minute." : "L'IA regarde ton assiette, quelques secondes."}</div>` : ""}
    ${!d.loading && !noKey && !d.analysed ? `<div class="muted small" id="ahint" style="text-align:center" ${d.photo || d.note.trim() ? "hidden" : ""}>Ajoute une photo ou une description pour lancer l'analyse.</div>` : ""}
    ${d.photo && showManual ? `<button class="btn ghost sm" id="manual">${PEN}Saisir à la main</button>` : ""}
    ${d.photo || d.items.length ? `<button class="textbtn" id="reset">Tout recommencer</button>` : ""}
  </section>
  ${result}`;
}

function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Format d'image non lu. Essaie une photo JPEG ou PNG.")); };
    img.src = url;
  });
}
function toJpeg(img, max, q, square){
  const c = document.createElement("canvas");
  let w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
  if (square){ const s = Math.min(w,h); sx = (w-s)/2; sy = (h-s)/2; sw = sh = s; w = h = max; }
  else { const k = Math.min(1, max/Math.max(w,h)); w = Math.round(w*k); h = Math.round(h*k); }
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return c.toDataURL("image/jpeg", q);
}

const SYSTEM = `Tu es un nutritionniste. Tu estimes le contenu d'un repas à partir d'une photo et/ou d'une description.
Identifie chaque aliment visible. Estime sa masse en grammes telle que servie (poids cuit si l'aliment est cuit), en t'aidant des repères de taille : assiette plate d'environ 26 cm, couverts, mains, emballages.
Donne ensuite ses calories et macronutriments à partir de valeurs de tables de composition classiques (type Ciqual).
Pense aux matières grasses de cuisson, sauces, assaisonnements et boissons : ajoute-les comme éléments séparés s'ils sont vraisemblables.
Si l'utilisateur donne des quantités ou des précisions, elles priment sur ton estimation visuelle.
Réponds uniquement avec un objet JSON valide, sans texte autour, de la forme :
{"plat": "nom court du repas", "items": [{"nom": "string", "grammes": 0, "kcal": 0, "proteines": 0, "glucides": 0, "lipides": 0}], "hypotheses": "une ou deux phrases sur ce qui est incertain", "confiance": "faible" | "moyenne" | "haute"}
Les nombres sont sans unités. Si l'image ne montre pas de nourriture, renvoie "items": [] et explique pourquoi dans "hypotheses".`;

async function callModel(){
  const st = S.settings;
  const base = (st.baseUrl || "https://api.deepseek.com").replace(/\/+$/, "");
  const isDeepSeek = /deepseek\.com/.test(base);
  const userText = (draft.note ? "Précisions de l'utilisateur : " + draft.note + "\n" : "") + `Type de repas : ${draft.type}. Analyse ce repas et réponds en JSON.`;
  const content = draft.photo
    ? [{ type:"text", text:userText }, { type:"image_url", image_url:{ url:draft.photo } }]
    : userText;
  const body = { model: st.model || "deepseek-flash", messages:[{ role:"system", content:SYSTEM }, { role:"user", content }],
                 stream:false, max_tokens: st.deep ? 6000 : 1800, response_format:{ type:"json_object" } };
  if (isDeepSeek) body.thinking = { type: st.deep ? "enabled" : "disabled" };
  if (isDeepSeek && st.deep) body.reasoning_effort = "high";

  const send = async b => {
    let r;
    try {
      r = await fetch(base + "/chat/completions", { method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + st.apiKey.trim() }, body: JSON.stringify(b) });
    } catch(e){
      throw new Error("Impossible de joindre l'API. Vérifie ta connexion. Si le problème persiste, le navigateur bloque peut-être l'appel direct : essaie OpenRouter dans Réglages.");
    }
    const txt = await r.text();
    if (!r.ok){
      let msg = txt; try { msg = JSON.parse(txt).error?.message || txt; } catch(e){}
      const err = new Error(r.status === 401 ? "Clé API refusée. Vérifie-la dans Réglages."
        : r.status === 402 ? "Solde DeepSeek insuffisant. Recharge ton compte sur platform.deepseek.com."
        : r.status === 429 ? "Trop de requêtes. Réessaie dans quelques secondes."
        : "Erreur " + r.status + " : " + String(msg).slice(0, 220));
      err.status = r.status; throw err;
    }
    return JSON.parse(txt);
  };
  let data;
  try { data = await send(body); }
  catch(e){
    if (e.status === 400){ delete body.response_format; delete body.thinking; delete body.reasoning_effort; data = await send(body); }
    else throw e;
  }
  const text = data?.choices?.[0]?.message?.content || "";
  const a = text.indexOf("{"), z = text.lastIndexOf("}");
  if (a < 0 || z < a) throw new Error("Réponse illisible du modèle. Réessaie.");
  let j; try { j = JSON.parse(text.slice(a, z+1)); } catch(e){ throw new Error("Réponse illisible du modèle. Réessaie."); }
  return j;
}
function normItem(x){
  const it = { nom: String(x.nom || x.name || "Aliment"), g: num(x.grammes ?? x.g), kcal: num(x.kcal), p: num(x.proteines ?? x.p), c: num(x.glucides ?? x.c), f: num(x.lipides ?? x.f) };
  setRatio(it); return it;
}
function setRatio(it){ it.ratio = it.g > 0 ? { kcal: it.kcal/it.g, p: it.p/it.g, c: it.c/it.g, f: it.f/it.g } : null; }

async function analyse(){
  if (!draft.photo && !draft.note.trim()){ toast("Ajoute une photo ou une description."); return; }
  draft.loading = true; draft.error = ""; render();
  try {
    const j = await callModel();
    draft.items = Array.isArray(j.items) ? j.items.map(normItem) : [];
    draft.name = j.plat || draft.name; draft.hyp = j.hypotheses || ""; draft.conf = j.confiance || "";
    draft.analysed = true;
    if (!draft.items.length) draft.error = "Aucun aliment détecté. Ajoute des précisions ou saisis à la main.";
  } catch(e){ draft.error = e.message; }
  draft.loading = false; render();
  if (draft.items.length) document.getElementById("items")?.scrollIntoView({ behavior:"smooth", block:"start" });
}

function saveMeal(){
  const items = draft.items.filter(i => i.nom.trim() || i.kcal).map(({ratio, ...rest}) => rest);
  if (!items.length){ toast("Ajoute au moins un aliment."); return; }
  const now = new Date();
  S.meals.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), date: curDate,
    time: String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0"),
    type: draft.type, name: draft.name.trim(), items, thumb: draft.thumb });
  if (!save()){ S.meals.pop(); return; }
  draft = newDraft(); toast("Repas ajouté"); go("journal");
}

/* ---------- history ---------- */
const kg1 = n => n.toLocaleString("fr-FR", { minimumFractionDigits:1, maximumFractionDigits:1 });
function histReadout(d){
  const t = dayTotals(d);
  const lbl = parseISO(d).toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
  return `<div><b>${esc(lbl)}</b><div class="muted small num">${t.kcal ? `${fmt(t.kcal)} kcal · P ${fmt(t.p)} · G ${fmt(t.c)} · L ${fmt(t.f)}` : "Rien de saisi"}</div></div>
    <button class="btn ghost sm" data-goto="${d}">Voir</button>`;
}
function sparkHTML(pts){
  const lo = Math.min(...pts.map(w => w.kg)), hi = Math.max(...pts.map(w => w.kg)), span = hi - lo || 1;
  const d = pts.map((w,i) => `${i ? "L" : "M"}${(i/(pts.length-1)*100).toFixed(2)} ${(hi === lo ? 50 : 88 - (w.kg-lo)/span*76).toFixed(2)}`).join("");
  return `<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Courbe de poids"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
}
function historyHTML(){
  const g = S.settings.goals, today = todayISO(), sel = histSel || today;
  const days = []; for (let i = 13; i >= 0; i--) days.push(shift(today, -i));
  const tots = days.map(dayTotals);
  const max = Math.max(g.kcal*1.25, ...tots.map(t => t.kcal));
  let sumK = 0, sumP = 0, n = 0;
  tots.forEach((t, i) => { const back = 13 - i; if (t.kcal > 0 && back > 0 && back <= 7){ sumK += t.kcal; sumP += t.p; n++; } });
  const cols = days.map((d, i) => { const t = tots[i];
    return `<button class="col${t.kcal ? "" : " none"}${t.kcal > g.kcal*1.1 ? " over" : ""}${d === sel ? " sel" : ""}" data-day="${d}" aria-label="${esc(dayLabel(d))} : ${fmt(t.kcal)} kcal"><i${t.kcal ? ` style="height:${t.kcal/max*100}%"` : ""}></i></button>`; }).join("");
  const letters = days.map(d => `<span${d === today ? ` class="today"` : ""}>${parseISO(d).toLocaleDateString("fr-FR", { weekday:"narrow" })}</span>`).join("");
  const ws = [...S.weights].sort((a,b) => a.date.localeCompare(b.date));
  const first = ws[0], last = ws[ws.length-1];
  const delta = ws.length > 1 ? last.kg - first.kg : null;
  return `
  <div class="top"><div><div class="title">Historique</div><div class="sub">Tes tendances récentes</div></div></div>
  <section class="card">
    <h2>Moyenne des 7 derniers jours</h2>
    <div class="num" style="font-size:1.5rem;font-weight:700;letter-spacing:-.02em">${n ? `${fmt(sumK/n)} kcal · ${fmt(sumP/n)} g prot.` : "Pas encore assez de données"}</div>
    <div class="muted small">Calculée sur les jours complets renseignés, sans aujourd'hui.</div>
  </section>
  <section class="card">
    <h2>14 derniers jours</h2>
    <div class="hread" id="hread">${histReadout(sel)}</div>
    <div class="chartbox"><div class="chart">${cols}</div><div class="goalline" style="bottom:${g.kcal/max*100}%"></div></div>
    <div class="days">${letters}</div>
    <div class="muted small">Ligne pointillée : ton objectif de ${fmt(g.kcal)} kcal. Touche une barre pour le détail.</div>
  </section>
  <section class="card">
    <h2>Poids</h2>
    ${last ? `<div class="wtop"><div class="wbig num">${kg1(last.kg)}<small> kg</small></div>
      ${delta !== null ? `<div class="small" style="text-align:right"><b class="num">${delta > 0 ? "+" : ""}${kg1(delta)} kg</b><br><span class="muted">depuis le ${parseISO(first.date).toLocaleDateString("fr-FR")}</span></div>` : ""}</div>` : ""}
    ${ws.length > 1 ? sparkHTML(ws.slice(-30)) : ""}
    <div class="row"><input type="number" inputmode="decimal" step="0.1" id="wkg" placeholder="ex. 78.4" aria-label="Poids en kg" style="flex:2 1 120px">
      <button class="btn" id="wsave" style="flex:1 1 100px">Enregistrer</button></div>
    <div class="wlist">${[...ws].reverse().slice(0,5).map(w => `<div><span class="muted">${parseISO(w.date).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}</span><span>${kg1(w.kg)} kg</span></div>`).join("") || `<div class="muted small">Pèse-toi le matin à jeun, 1 à 2 fois par semaine, pour suivre la tendance.</div>`}</div>
  </section>`;
}

/* ---------- settings ---------- */
function settingsHTML(){
  const st = S.settings, g = st.goals;
  return `
  <div class="top"><div><div class="title">Réglages</div><div class="sub">Objectifs, IA et données</div></div></div>
  <section class="card">
    <h2>Objectifs quotidiens</h2>
    <div class="row">
      <label class="f">Calories (kcal)<input type="number" inputmode="numeric" id="g-kcal" value="${g.kcal}"></label>
      <label class="f">Protéines (g)<input type="number" inputmode="numeric" id="g-p" value="${g.p}"></label>
    </div>
    <div class="row">
      <label class="f">Glucides (g)<input type="number" inputmode="numeric" id="g-c" value="${g.c}"></label>
      <label class="f">Lipides (g)<input type="number" inputmode="numeric" id="g-f" value="${g.f}"></label>
    </div>
    <div class="muted small" id="gcheck"></div>
  </section>
  <section class="card">
    <h2>Modèle d'IA</h2>
    <div class="fl">Clé API
      <div class="pw"><input type="password" id="apikey" autocomplete="off" value="${esc(st.apiKey)}" placeholder="sk-…" aria-label="Clé API"><button type="button" class="btn ghost" id="showkey">Afficher</button></div></div>
    <div class="muted small">La clé reste sur ce téléphone. Crée-la sur platform.deepseek.com, section API keys.</div>
    <label class="f">Adresse de l'API<input type="url" id="baseurl" value="${esc(st.baseUrl)}"></label>
    <label class="f">Modèle<input type="text" id="model" value="${esc(st.model)}"></label>
    <div class="muted small">Par défaut : https://api.deepseek.com et deepseek-flash (DeepSeek V4.1 Flash). Tout service compatible OpenAI avec la vision fonctionne, par exemple OpenRouter.</div>
  </section>
  <button class="btn" id="savesettings">Enregistrer les réglages</button>
  <section class="card">
    <h2>Données</h2>
    <div class="muted small">${S.meals.length} repas et ${S.weights.length} pesées enregistrés sur cet appareil. Exporte de temps en temps : si tu vides les données du navigateur, tout est perdu.</div>
    <div class="row"><button class="btn ghost" id="export">Exporter</button>
      <label class="btn ghost" style="cursor:pointer" for="import">Importer<input type="file" id="import" accept="application/json,.json" hidden></label></div>
    <button class="btn danger${armedDelete === "wipe" ? " armed" : ""}" id="wipe">${armedDelete === "wipe" ? "Toucher encore pour tout effacer" : "Tout effacer"}</button>
  </section>`;
}
function goalCheck(){
  const v = k => num($("#g-"+k)?.value);
  const calc = v("p")*4 + v("c")*4 + v("f")*9;
  const el = $("#gcheck"); if (!el) return;
  el.textContent = `Tes macros font ${fmt(calc)} kcal (protéines et glucides 4 kcal/g, lipides 9 kcal/g).` + (Math.abs(calc - v("kcal")) > 150 ? " Écart notable avec l'objectif calorique." : "");
}

/* ---------- events ---------- */
function bind(){
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  // journal
  on("#prev","click", () => { curDate = shift(curDate,-1); armedDelete = null; render(); });
  on("#next","click", () => { if (curDate < todayISO()){ curDate = shift(curDate,1); armedDelete = null; render(); } });
  on("#today","click", () => { if (curDate !== todayISO()){ curDate = todayISO(); armedDelete = null; render(); } });
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  document.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
    openMeal = openMeal === b.dataset.toggle ? null : b.dataset.toggle; armedDelete = null; render();
  }));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.del;
    if (armedDelete !== id){ arm(id); render(); return; }
    S.meals = S.meals.filter(m => m.id !== id); armedDelete = null; if (openMeal === id) openMeal = null; save(); render(); toast("Repas supprimé");
  }));
  document.querySelectorAll("[data-delphoto]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.delphoto, key = "ph:" + id;
    if (armedDelete !== key){ arm(key); render(); return; }
    const m = S.meals.find(x => x.id === id); armedDelete = null;
    if (m){ m.thumb = null; save(); }
    render(); toast("Photo retirée");
  }));
  // add
  const onPhoto = async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try { const img = await loadImage(file);
      draft.photo = toJpeg(img, 1280, 0.85, false); draft.thumb = toJpeg(img, 160, 0.7, true);
      draft.error = ""; render();
    } catch(err){ draft.error = err.message; render(); }
  };
  on("#photo","change", onPhoto);
  on("#photocam","change", onPhoto);
  on("#rmphoto","click", () => { draft.photo = null; draft.thumb = null; draft.error = ""; render(); });
  on("#note","input", e => {
    draft.note = e.target.value;
    const b = $("#analyse"); if (b) b.disabled = !canAnalyse();
    const h = $("#ahint"); if (h) h.hidden = !!(draft.photo || draft.note.trim());
  });
  document.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => {
    draft.type = b.dataset.type;
    document.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-checked", String(x === b)));
  }));
  on("#deep","change", e => { S.settings.deep = e.target.checked; save(); });
  on("#analyse","click", analyse);
  on("#manual","click", () => { draft.items.push({ nom:"", g:0, kcal:0, p:0, c:0, f:0, ratio:null }); draft.analysed = true; render(); });
  on("#additem","click", () => { draft.items.push({ nom:"", g:0, kcal:0, p:0, c:0, f:0, ratio:null }); render(); });
  on("#reset","click", () => { draft = newDraft(); render(); });
  on("#mealname","input", e => draft.name = e.target.value);
  on("#savemeal","click", saveMeal);
  document.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { draft.items.splice(+b.dataset.rm, 1); render(); }));
  document.querySelectorAll("#items input[type=number]").forEach(inp => inp.addEventListener("focus", () => inp.select()));
  document.querySelectorAll("#items input").forEach(inp => inp.addEventListener("input", () => {
    const i = +inp.dataset.i, k = inp.dataset.k, it = draft.items[i];
    if (k === "nom"){ it.nom = inp.value; return; }
    const v = num(inp.value);
    if (k === "g"){
      it.g = v;
      if (it.ratio){ for (const m of ["kcal","p","c","f"]){ it[m] = it.ratio[m]*v; const el = document.getElementById(`it-${i}-${m}`); if (el) el.value = it[m] ? r0(it[m]*10)/10 : ""; } }
      else setRatio(it);
    } else { it[k] = v; setRatio(it); }
    $("#totals").innerHTML = totalsHTML();
    const sb = $("#savemeal"); if (sb) sb.disabled = !draft.items.length;
  }));
  // history
  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    histSel = b.dataset.day;
    document.querySelectorAll("[data-day]").forEach(x => x.classList.toggle("sel", x === b));
    $("#hread").innerHTML = histReadout(histSel);
  }));
  on("#hread","click", e => { const b = e.target.closest("[data-goto]"); if (b){ curDate = b.dataset.goto; go("journal"); } });
  on("#wsave","click", () => {
    const kg = num($("#wkg").value); if (!kg || kg < 25 || kg > 300){ toast("Entre un poids en kg, ex. 78.4"); return; }
    const d = todayISO(); S.weights = S.weights.filter(w => w.date !== d); S.weights.push({ date:d, kg });
    save(); render(); toast("Poids enregistré");
  });
  // settings
  ["kcal","p","c","f"].forEach(k => on("#g-"+k, "input", goalCheck)); goalCheck();
  on("#showkey","click", e => {
    const i = $("#apikey"), show = i.type === "password";
    i.type = show ? "text" : "password"; e.currentTarget.textContent = show ? "Masquer" : "Afficher";
  });
  on("#savesettings","click", () => {
    const st = S.settings;
    st.apiKey = $("#apikey").value.trim(); st.baseUrl = $("#baseurl").value.trim() || DEFAULTS.settings.baseUrl;
    st.model = $("#model").value.trim() || DEFAULTS.settings.model;
    for (const k of ["kcal","p","c","f"]){ const v = num($("#g-"+k).value); if (v) st.goals[k] = Math.round(v); }
    if (save()) toast("Réglages enregistrés");
    render();
  });
  on("#export","click", () => {
    const out = { app:"assiette", version:1, exported: new Date().toISOString(), goals:S.settings.goals, meals:S.meals, weights:S.weights };
    const blob = new Blob([JSON.stringify(out)], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `assiette-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  on("#import","change", async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try {
      const j = JSON.parse(await file.text());
      if (!Array.isArray(j.meals) || !Array.isArray(j.weights)) throw new Error();
      const ids = new Set(S.meals.map(m => m.id));
      S.meals = S.meals.concat(j.meals.filter(m => m && m.id && m.date && Array.isArray(m.items) && !ids.has(m.id)));
      const wd = new Set(S.weights.map(w => w.date));
      S.weights = S.weights.concat(j.weights.filter(w => w && w.date && num(w.kg) && !wd.has(w.date)));
      if (j.goals) Object.assign(S.settings.goals, j.goals);
      save(); render(); toast("Données importées");
    } catch(err){ toast("Fichier non reconnu. Choisis un export d'Assiette (.json)."); }
  });
  on("#wipe","click", () => {
    if (armedDelete !== "wipe"){ arm("wipe"); render(); return; }
    S.meals = []; S.weights = []; armedDelete = null; save(); render(); toast("Données effacées");
  });
}

// glisser à l'horizontale dans le journal : jour précédent / suivant
let sw = null;
document.addEventListener("touchstart", e => {
  const t = e.touches[0];
  sw = (view === "journal" && e.touches.length === 1 && t.clientX > 24 && t.clientX < innerWidth - 24) ? { x:t.clientX, y:t.clientY } : null;
}, { passive:true });
document.addEventListener("touchend", e => {
  if (!sw) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y; sw = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy)*2) return;
  if (dx > 0){ curDate = shift(curDate,-1); armedDelete = null; render(); }
  else if (curDate < todayISO()){ curDate = shift(curDate,1); armedDelete = null; render(); }
}, { passive:true });

render(); animateIn();
if (!S.settings.apiKey && !S.meals.length) toast("Commence par ajouter ta clé DeepSeek dans Réglages.");
</script>
</body>
</html>
