function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Format d'image non lu. Essaie une photo JPEG ou PNG.")); };
    img.src = url;
  });
}
function toJpeg(img, max, q, square){
  const c = document.createElement("canvas");
  let w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
  if (square){ const s = Math.min(w,h); sx = (w-s)/2; sy = (h-s)/2; sw = sh = s; w = h = max; }
  else { const k = Math.min(1, max/Math.max(w,h)); w = Math.round(w*k); h = Math.round(h*k); }
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return c.toDataURL("image/jpeg", q);
}

const SYSTEM = `Tu es un nutritionniste. Tu estimes le contenu d'un repas à partir d'une ou plusieurs photos et/ou d'une description.
Plusieurs photos montrent le même repas (angles différents, autre plat, dessert, boisson) : ne compte jamais deux fois un aliment visible sur plusieurs photos.
Si une photo montre une étiquette ou un tableau de valeurs nutritionnelles, utilise ces valeurs pour 100 g plutôt que les tables, et estime la quantité consommée.
Identifie chaque aliment visible. Estime sa masse en grammes telle que servie (poids cuit si l'aliment est cuit), en t'aidant des repères de taille : assiette plate d'environ 26 cm, couverts, mains, emballages.
Donne ensuite ses calories et macronutriments à partir de valeurs de tables de composition classiques (type Ciqual).
Pense aux matières grasses de cuisson, sauces, assaisonnements et boissons : ajoute-les comme éléments séparés s'ils sont vraisemblables.
Si l'utilisateur donne des quantités ou des précisions, elles priment sur ton estimation visuelle.
L'utilisateur peut avoir scanné des produits emballés, listés avec leur code-barres et leurs valeurs officielles pour 100 g du produit tel que vendu. Il les a mangés : chacun doit apparaître une fois dans "items", même sans photo, avec son "code" et ces valeurs exactes (jamais celles des tables).
Pour un produit scanné, "grammes" est le poids du produit tel que vendu (souvent sec ou cru). Si l'utilisateur donne le poids servi d'un produit qui se cuit (ex. « 300 g de riz » dans l'assiette), convertis-le en poids tel que vendu (riz, pâtes, semoule : poids cuit divisé par 2,5 à 3 environ) et explique la conversion dans "hypotheses". Sans quantité ni photo exploitable, prends la portion indiquée ou une portion habituelle.
Un aliment de la photo qui correspond à un produit scanné n'est compté qu'une fois, sous le produit scanné.
Pour chaque aliment non scanné, donne aussi "ciqual" : son intitulé le plus proche dans la table Ciqual de l'Anses, avec l'état et la cuisson, ex. « Riz blanc, cuit », « Poulet, filet sans peau grillé/poêlé », « Huile d'olive vierge extra », « Brocoli, cuit à la vapeur ». Les valeurs de la table remplaceront les tiennes : sois précis sur cru ou cuit.
Si une information change nettement le résultat et que tu ne peux pas la déduire (cru ou cuit, quantité, type de sauce, lait entier ou écrémé…), pose une seule question courte dans "question". Sinon, laisse "question" vide.
Réponds uniquement avec un objet JSON valide, sans texte autour, de la forme :
{"plat": "nom court du repas", "items": [{"nom": "string", "grammes": 0, "kcal": 0, "proteines": 0, "glucides": 0, "lipides": 0, "ciqual": "intitulé Ciqual", "code": "code-barres, uniquement pour un produit scanné"}], "hypotheses": "une ou deux phrases sur ce qui est incertain", "confiance": "faible" | "moyenne" | "haute", "question": ""}
Les nombres sont sans unités. Si rien ne montre de nourriture et qu'aucun produit n'est scanné, renvoie "items": [] et explique pourquoi dans "hypotheses".`;

async function callModel(){
  const st = S.settings;
  const base = (st.baseUrl || "https://api.deepseek.com").replace(/\/+$/, "");
  const isDeepSeek = /deepseek\.com/.test(base);
  const direct = draft.items.filter(i => i.scan);
  const r1 = n => Math.round(n*10)/10;
  const userText = (draft.note ? "Quantités et précisions de l'utilisateur : " + draft.note + "\n" : "")
    + (draft.products.length ? "Produits scannés (valeurs pour 100 g, tel que vendu) :\n" + draft.products.map(pr =>
        `- code ${pr.code} : ${pr.nom} : ${r1(pr.per.kcal)} kcal, protéines ${r1(pr.per.p)} g, glucides ${r1(pr.per.c)} g, lipides ${r1(pr.per.f)} g`
        + (pr.portion ? `, portion indiquée ${r1(pr.portion)} g` : "")).join("\n") + "\n" : "")
    + (direct.length ? "Déjà comptés, ne les ajoute pas : " + direct.map(i => i.nom).join(" ; ") + ".\n" : "")
    + (draft.photos.length > 1 ? `${draft.photos.length} photos du même repas.\n` : "")
    + (!draft.photos.length ? "Pas de photo : base-toi sur les produits scannés et les précisions.\n" : "")
    + `Type de repas : ${draft.type}. Analyse ce repas et réponds en JSON.`;
  const content = draft.photos.length
    ? [{ type:"text", text:userText }, ...draft.photos.map(p => ({ type:"image_url", image_url:{ url:p.full } }))]
    : userText;
  const body = { model: st.model || "deepseek-flash", messages:[{ role:"system", content:SYSTEM }, { role:"user", content }],
                 stream:false, max_tokens: st.deep ? 6000 : 2400, response_format:{ type:"json_object" } };
  if (isDeepSeek) body.thinking = { type: st.deep ? "enabled" : "disabled" };
  if (isDeepSeek && st.deep) body.reasoning_effort = "high";

  const send = async b => {
    let r;
    try {
      r = await fetch(base + "/chat/completions", { method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + st.apiKey.trim() }, body: JSON.stringify(b) });
    } catch(e){
      throw new Error("Impossible de joindre l'API. Vérifie ta connexion. Si le problème persiste, le navigateur bloque peut-être l'appel direct : essaie OpenRouter dans Réglages.");
    }
    const txt = await r.text();
    if (!r.ok){
      let msg = txt; try { msg = JSON.parse(txt).error?.message || txt; } catch(e){}
      const err = new Error(r.status === 401 ? "Clé API refusée. Vérifie-la dans Réglages."
        : r.status === 402 ? "Solde DeepSeek insuffisant. Recharge ton compte sur platform.deepseek.com."
        : r.status === 429 ? "Trop de requêtes. Réessaie dans quelques secondes."
        : "Erreur " + r.status + " : " + String(msg).slice(0, 220));
      err.status = r.status; throw err;
    }
    return JSON.parse(txt);
  };
  let data;
  try { data = await send(body); }
  catch(e){
    if (e.status === 400){ delete body.response_format; delete body.thinking; delete body.reasoning_effort; data = await send(body); }
    else throw e;
  }
  const text = data?.choices?.[0]?.message?.content || "";
  const a = text.indexOf("{"), z = text.lastIndexOf("}");
  if (a < 0 || z < a) throw new Error("Réponse illisible du modèle. Réessaie.");
  let j; try { j = JSON.parse(text.slice(a, z+1)); } catch(e){ throw new Error("Réponse illisible du modèle. Réessaie."); }
  return j;
}
function normItem(x){
  const it = { nom: String(x.nom || x.name || "Aliment"), g: num(x.grammes ?? x.g), kcal: num(x.kcal), p: num(x.proteines ?? x.p), c: num(x.glucides ?? x.c), f: num(x.lipides ?? x.f) };
  setRatio(it); return it;
}
function setRatio(it){ it.ratio = it.g > 0 ? { kcal: it.kcal/it.g, p: it.p/it.g, c: it.c/it.g, f: it.f/it.g } : null; }

// aliment calculé à partir des valeurs pour 100 g d'un produit scanné
function productItem(pr, g){
  const it = { nom: pr.nom, g, kcal: pr.per.kcal*g/100, p: pr.per.p*g/100, c: pr.per.c*g/100, f: pr.per.f*g/100,
    code: pr.code, info: `Code-barres · ${fmt(pr.per.kcal)} kcal pour 100 g · poids tel que vendu` };
  setRatio(it); return it;
}
async function analyse(){
  if (!draft.photos.length && !draft.products.length && !draft.note.trim()){ toast("Ajoute une photo, un produit scanné ou une description."); return; }
  draft.loading = true; draft.error = ""; draft.question = ""; render();
  const ciqReady = loadCiqual().catch(() => null);   // téléchargée pendant que l'IA réfléchit
  try {
    const j = await callModel();
    await ciqReady;
    const raw = Array.isArray(j.items) ? j.items : [];
    const byCode = new Map(draft.products.map(pr => [pr.code, pr]));
    const seen = new Set();
    // l'IA choisit les grammes ; les macros viennent d'Open Food Facts (produit scanné),
    // sinon de la table Ciqual quand la correspondance est sûre, sinon de l'estimation de l'IA
    const found = raw.map(x => {
      const pr = byCode.get(String(x.code ?? "").replace(/\D/g, ""));
      if (pr && !seen.has(pr.code)){ seen.add(pr.code); return productItem(pr, num(x.grammes ?? x.g) || pr.portion || 100); }
      const it = normItem(x); it.ai = true;
      // si les kcal de l'IA contredisent ses propres macros, ce sont les macros qui servent de repère
      const aiK = (incoherent(it) ? atwater(it) : it.kcal) / it.g * 100;
      const food = CIQ && it.g > 0 ? pickCiqual(String(x.ciqual || x.nom || ""), aiK) : null;
      return food ? ciqItem(food, it.g, it.nom) : it;
    });
    const missing = draft.products.filter(pr => !seen.has(pr.code));
    missing.forEach(pr => found.push(productItem(pr, pr.portion || 100)));
    draft.products.forEach(pr => pr.used = true);
    // les produits ajoutés tels quels restent ; le reste est remplacé par la nouvelle analyse
    draft.items = draft.items.filter(i => i.scan).concat(found);
    draft.name = j.plat || draft.name; draft.conf = j.confiance || "";
    draft.question = String(j.question || "").trim();
    draft.hyp = [j.hypotheses || "", missing.length ? `Ajouté avec la portion indiquée, à vérifier : ${missing.map(p => p.nom).join(", ")}.` : ""].filter(Boolean).join(" ");
    draft.analysed = true;
    if (!found.length) draft.error = "Aucun aliment détecté. Ajoute des précisions ou saisis à la main.";
  } catch(e){ draft.error = e.message; }
  draft.loading = false; render();
  if (draft.items.length) document.getElementById("items")?.scrollIntoView({ behavior:"smooth", block:"start" });
}

function saveMeal(){
  const items = draft.items.filter(i => i.nom.trim() || i.kcal).map(({ nom, g, kcal, p, c, f }) => ({ nom, g, kcal, p, c, f }));
  if (!items.length){ toast("Ajoute au moins un aliment."); return; }
  const pending = draft.products.filter(p => !p.used);
  if (pending.length){ toast(`${S.settings.apiKey ? "Relance l'analyse pour compter" : "Ajoute tel quel"} ${pending.map(p => p.nom).join(", ")}, ou retire-le.`); return; }
  const date = draft.date || curDate, time = draft.time || defaultTime(date, draft.type);
  if (date > todayISO()){ toast("Choisis aujourd'hui ou une date passée."); return; }
  const data = { date, time, type:draft.type, name:draft.name.trim(), items, thumb: draft.photos[0]?.thumb || draft.thumb || null };
  if (draft.editId){
    const m = S.meals.find(x => x.id === draft.editId);
    if (!m){ draft = newDraft(); toast("Ce repas n'existe plus."); go("journal"); return; }
    const before = { ...m }; Object.assign(m, data);
    if (!save()){ Object.assign(m, before); return; }
    openMeal = m.id; toast("Repas modifié");
  } else {
    S.meals.push({ id:newId(), ...data });
    if (!save()){ S.meals.pop(); return; }
    toast("Repas ajouté");
  }
  curDate = date; draft = newDraft(); go("journal");
}

/* ---------- code-barres ---------- */
// Chrome Android a un lecteur intégré (BarcodeDetector). Safari iOS non : on charge alors
// la même API en version ZXing/WebAssembly, seulement au premier scan.
const BD_URL = "https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js";
const BD_SRI = "sha384-KJVUIUGb4pmfpWXfD8j3y9ARn6KoGC2vPC/wNUX1O1ZkYemh0BsuvsmdEU2+wS7O";
const FORMATS = ["ean_13","ean_8","upc_a","upc_e"];
let detectorP = null;
function loadScript(src, integrity){
  return new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.integrity = integrity; s.crossOrigin = "anonymous";
    s.onload = res; s.onerror = () => { s.remove(); rej(new Error("load")); };
    document.head.appendChild(s);
  });
}
function getDetector(){
  if (!detectorP) detectorP = (async () => {
    if ("BarcodeDetector" in window){
      try { const f = await window.BarcodeDetector.getSupportedFormats(); if (f.includes("ean_13")) return new window.BarcodeDetector({ formats: FORMATS }); } catch(e){}
    }
    if (!window.BarcodeDetectionAPI) await loadScript(BD_URL, BD_SRI);
    return new window.BarcodeDetectionAPI.BarcodeDetector({ formats: FORMATS });
  })().catch(e => { detectorP = null; throw new Error("Lecteur de code-barres non chargé. Vérifie ta connexion, ou tape le code."); });
  return detectorP;
}

// chiffre de contrôle GTIN (EAN-8, UPC-A, EAN-13, GTIN-14) : repère les fautes de frappe à la saisie manuelle
function gtinOk(code){
  if (![8,12,13,14].includes(code.length)) return false;
  const d = code.split("").map(Number), check = d.pop();
  const s = d.reverse().reduce((t, x, i) => t + x * (i % 2 ? 1 : 3), 0);
  return (10 - s % 10) % 10 === check;
}
// renvoie { code, nom, per, portion }, ou null si introuvable, ou { nom, empty:true } sans valeurs nutritionnelles
const offCache = new Map();
async function lookupOFF(code){
  const known = S.scanned.find(p => p.code === code);   // déjà scanné : pas d'appel réseau
  if (known) return known;
  if (!offCache.has(code)) offCache.set(code, fetchOFF(code).catch(e => { offCache.delete(code); throw e; }));
  return offCache.get(code);
}
async function fetchOFF(code){
  let r;
  try { r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_fr,generic_name_fr,brands,nutriments,serving_quantity`); }
  catch(e){ throw new Error("Open Food Facts injoignable. Vérifie ta connexion."); }
  if (r.status === 404) return null;
  // Open Food Facts limite à 15 fiches produit par minute et par adresse IP
  if (r.status === 429) throw new Error("Trop de scans en une minute pour Open Food Facts. Attends une minute puis rescanne.");
  if (!r.ok) throw new Error(`Open Food Facts indisponible (erreur ${r.status}). Réessaie dans un instant.`);
  const j = await r.json();
  if (j.status !== 1 || !j.product) return null;
  const p = j.product, n = p.nutriments || {};
  const name = String(p.product_name_fr || p.product_name || p.generic_name_fr || "").trim();
  const brand = String(p.brands || "").split(",")[0].trim();
  // marque ajoutée seulement si elle apporte quelque chose (pas « Coca-Cola · COCA-COLA SERVICES SA/NV »)
  const key = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
  const same = name && brand && (key(brand).includes(key(name)) || key(name).includes(key(brand).slice(0, 6)));
  const nom = name && brand && !same && brand.length <= 24 ? `${name} · ${brand}` : (name || brand || `Produit ${code}`);
  const k100 = num(n["energy-kcal_100g"]) || num(n.energy_100g) / 4.184;
  const per = { kcal:k100, p:num(n.proteins_100g), c:num(n.carbohydrates_100g), f:num(n.fat_100g) };
  if (!per.kcal && !per.p && !per.c && !per.f) return { nom, empty:true };
  return { code, nom, per, portion: num(p.serving_quantity) };
}

let SC = null;   // scanner ouvert : { stream, det, seen, added, busy, timer }
function scannerHTML(){
  return `<div class="scanner idle" id="scanner" role="dialog" aria-modal="true" aria-label="Scanner un code-barres">
    <video id="scvideo" playsinline muted autoplay></video>
    <div class="sc-top"><b>Code-barres</b><button class="sc-close" id="scclose" aria-label="Fermer le scanner">${XI}</button></div>
    <div class="sc-frame"><div class="sc-box"><i class="sc-laser"></i></div></div>
    <div class="sc-bottom">
      <div class="sc-msg" id="scmsg" role="status">Démarrage de la caméra…</div>
      <div class="sc-list" id="sclist"></div>
      <form class="sc-row" id="scform"><input id="sccode" inputmode="numeric" autocomplete="off" pattern="[0-9]*" placeholder="Ou tape le code (8 à 14 chiffres)" aria-label="Code-barres">
        <button class="sc-btn" type="submit">OK</button></form>
      <div class="sc-row"><label class="sc-btn" style="flex:1">${CAM}Photo du code<input type="file" id="scphoto" accept="image/*" capture="environment"></label>
        <button class="btn" id="scdone" style="flex:1">Terminé</button></div>
    </div></div>`;
}
function scMsg(text, kind){
  const m = $("#scmsg"); if (!m) return;
  m.textContent = text; m.className = "sc-msg" + (kind ? " " + kind : "");
}
// liste des produits du repas, retirables d'un tap sur la croix
function scList(){
  const l = $("#sclist"); if (!l || !SC) return;
  const n = draft.products.length;
  l.innerHTML = draft.products.map(pr => `<button class="sc-chip" data-sccode="${pr.code}" aria-label="Retirer ${esc(pr.nom)}"><span>${esc(pr.nom)}</span>${XI}</button>`).join("");
  const d = $("#scdone"); if (d) d.textContent = n ? `Terminé · ${n} produit${n > 1 ? "s" : ""}` : "Terminé";
}
function stopCamera(me){
  clearTimeout(me.timer);
  if (me.stream) me.stream.getTracks().forEach(t => t.stop());
  me.stream = null;
}
async function openScanner(){
  if (SC) return;
  const me = SC = { stream:null, det:null, seen:new Set(), added:[], busy:false, timer:0 };
  document.body.insertAdjacentHTML("beforeend", scannerHTML());
  document.body.classList.add("noscroll");
  history.pushState({ scanner:true }, "");
  $("#scclose").addEventListener("click", () => closeScanner());
  $("#scdone").addEventListener("click", () => closeScanner());
  $("#sclist").addEventListener("click", e => {
    const b = e.target.closest("[data-sccode]"); if (!b) return;
    const pr = draft.products.find(p => p.code === b.dataset.sccode); if (!pr) return;
    draft.products = draft.products.filter(p => p !== pr);
    me.seen.delete(pr.code); scList(); render();
    scMsg(`Retiré : ${pr.nom}`);
  });
  scList();
  $("#scform").addEventListener("submit", e => {
    e.preventDefault();
    const code = $("#sccode").value.replace(/\D/g, "");
    if (!gtinOk(code)){ scMsg(code.length === 12 || code.length < 13
      ? `Code incomplet ou erroné (${code.length} chiffres). La plupart des produits en ont 13 : vérifie-le sous les barres.`
      : "Ce code n'est pas valide. Vérifie les chiffres sous les barres.", "warn"); return; }
    $("#sccode").value = ""; $("#sccode").blur(); me.seen.delete(code); onCode(me, code);
  });
  $("#scphoto").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
    scMsg("Lecture de la photo…");
    try {
      const det = me.det || (me.det = await getDetector()), img = await loadImage(file);
      const code = (await det.detect(img)).map(b => b.rawValue).find(v => /^\d{8,14}$/.test(v));
      if (SC !== me) return;
      if (code){ me.seen.delete(code); onCode(me, code); }
      else scMsg("Aucun code-barres lu. Rapproche-toi, évite les reflets, ou tape le code.", "warn");
    } catch(err){ if (SC === me) scMsg(err.message, "warn"); }
  });

  startCamera(me);
}
async function startCamera(me){
  const detP = getDetector().then(d => me.det = d);
  if (!navigator.mediaDevices?.getUserMedia){
    scMsg("Caméra indisponible ici (il faut une page en HTTPS). Prends le code en photo ou tape-le.", "warn"); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1920 }, height:{ ideal:1080 } } });
    if (SC !== me){ stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const v = $("#scvideo"); v.srcObject = stream; await v.play().catch(() => {});
  } catch(e){
    if (SC === me) scMsg(e.name === "NotAllowedError"
      ? "Accès à la caméra refusé. Autorise-le dans les réglages du navigateur, ou tape le code."
      : "Impossible d'ouvrir la caméra. Prends le code en photo ou tape-le.", "warn");
    return;
  }
  try { await detP; } catch(e){ if (SC === me) scMsg(e.message, "warn"); return; }
  if (SC !== me || !me.stream) return;
  $("#scanner").classList.remove("idle");
  if (!me.added.length) scMsg(draft.products.length ? "Scanne un autre produit, ou touche Terminé" : "Place le code-barres dans le cadre");
  clearTimeout(me.timer); tick(me);
}
async function tick(me){
  if (SC !== me) return;
  const v = $("#scvideo");
  if (!me.busy && v && v.readyState >= 2){
    try {
      const code = (await me.det.detect(v)).map(b => b.rawValue).find(x => /^\d{8,14}$/.test(x));
      if (code && SC === me && !me.seen.has(code)) await onCode(me, code);
    } catch(e){}
  }
  if (SC === me && me.stream) me.timer = setTimeout(() => tick(me), 150);
}
async function onCode(me, code){
  me.seen.add(code);
  // un produit déjà dans la liste n'est jamais ajouté deux fois
  const dup = draft.products.find(p => p.code === code);
  if (dup){ scMsg(`Déjà dans la liste : ${dup.nom}`); return; }
  me.busy = true;
  try { navigator.vibrate && navigator.vibrate(40); } catch(e){}
  scMsg("Recherche du produit…");
  try {
    const pr = await lookupOFF(code);
    if (SC !== me) return;
    if (!pr) scMsg(`Produit ${code} introuvable. Prends son étiquette en photo, l'IA la lira.`, "warn");
    else if (pr.empty) scMsg(`${pr.nom} : pas de valeurs nutritionnelles connues. Photographie l'étiquette.`, "warn");
    else {
      draft.products.push({ ...pr, used:false });
      rememberProduct(pr);
      me.added.push(pr.code); scList(); render();
      scMsg(`Ajouté : ${pr.nom}. Scanne le suivant ou touche Terminé.`, "ok");
    }
  } catch(e){ if (SC === me){ me.seen.delete(code); scMsg(e.message, "warn"); } }
  finally { me.busy = false; }
}
function closeScanner(fromHistory){
  const me = SC; if (!me) return;
  SC = null; stopCamera(me);
  $("#scanner")?.remove(); document.body.classList.remove("noscroll");
  if (!fromHistory && history.state && history.state.scanner) history.back();
  const n = me.added.filter(code => draft.products.some(p => p.code === code)).length;
  if (n){
    toast(n > 1 ? `${n} produits ajoutés` : "Produit ajouté");
    setTimeout(() => document.getElementById("prods")?.scrollIntoView({ behavior:"smooth", block:"start" }), 50);
  }
}
// bouton retour d'Android : ferme le scanner au lieu de quitter l'appli
window.addEventListener("popstate", () => { if (SC) closeScanner(true); });
// en arrière-plan (autre appli, appareil photo du système pour « Photo du code ») :
// on coupe la caméra et on la relance au retour, sans fermer le scanner
document.addEventListener("visibilitychange", () => {
  const me = SC; if (!me) return;
  if (document.hidden){ if (me.stream){ stopCamera(me); me.paused = true; $("#scanner")?.classList.add("idle"); } }
  else if (me.paused){ me.paused = false; startCamera(me); }
});

/* ---------- table Ciqual ---------- */
// ciqual.json : table Ciqual 2025 de l'Anses (Licence Ouverte), réduite à [code, nom, kcal, p, c, f] pour 100 g.
// Chargée à la demande (≈ 70 Ko compressés) : l'IA nomme les aliments, la table donne les valeurs.
const CSTOP = new Set("de du des la le les l d a au aux en et avec pour ou un une sur type".split(" "));
const cnorm = s => String(s).toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").normalize("NFD").replace(/[̀-ͯ]/g, "");
const ctoks = s => cnorm(s).replace(/[^a-z0-9]+/g, " ").trim().split(" ").filter(t => t && !CSTOP.has(t)).map(t => t.length > 3 ? t.replace(/[sx]$/, "") : t);
let CIQ = null, ciqP = null;
function loadCiqual(){
  if (!ciqP) ciqP = fetch("ciqual.json").then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(j => {
    CIQ = j.aliments.map(([code, nom, kcal, p, c, f]) => ({ code, nom, per:{ kcal, p, c, f },
      // « (aliment moyen) » et « sans précision » marquent les entrées génériques : bonus, mais pas des mots à chercher
      t: ctoks(nom.replace(/\(aliment moyen\)|sans précision( sur [^,)]*)?/gi, "")), generic: /aliment moyen|sans précision/i.test(nom),
      head: ctoks(nom.split(",")[0]).join(" ") }));
    return CIQ;
  }).catch(() => { ciqP = null; throw new Error("Table Ciqual non chargée. Vérifie ta connexion."); });
  return ciqP;
}
// deux mots correspondent s'ils sont égaux ou ne diffèrent que par la fin (cuit/cuite, grillé/grillée)
const csame = (a, b) => a === b || (Math.min(a.length, b.length) >= 4 && Math.abs(a.length - b.length) <= 2 && (a.startsWith(b) || b.startsWith(a)));
// head : partie avant la première virgule (« Banane » pour « Banane, chair sans peau, crue ») ;
// si elle vaut exactement celle de la recherche, c'est l'aliment lui-même et non une variante (« Banane plantain »)
function cscore(q, qhead, food){
  let m = 0; for (const a of q) if (food.t.some(b => csame(a, b))) m++;
  if (!m) return { s:0, cov:0 };
  const cov = m / q.length, prec = m / Math.max(1, food.t.length);
  return { s: cov * .75 + prec * .25 + (csame(q[0], food.t[0] || "") ? .08 : 0) + (food.generic ? .03 : 0) + (food.head === qhead ? .06 : 0), cov };
}
function searchCiqual(q, n){
  const qt = ctoks(q), qhead = ctoks(String(q).split(",")[0]).join(" "); if (!qt.length || !CIQ) return [];
  return CIQ.map(food => ({ food, ...cscore(qt, qhead, food) })).filter(x => x.s > .3)
    .sort((x, y) => y.s - x.s || x.food.t.length - y.food.t.length).slice(0, n);
}
// correspondance automatique pour un aliment nommé par l'IA : tous les mots trouvés, et des calories
// compatibles avec l'estimation de l'IA (évite cru/cuit ou une mauvaise variante) ; sinon on garde l'estimation
function pickCiqual(q, aiK100){
  const r = searchCiqual(q, 12).filter(x => x.cov === 1); if (!r.length) return null;
  const near = x => !(aiK100 > 0) || Math.abs(x.food.per.kcal - aiK100) <= Math.max(20, .25 * aiK100);
  let c = r[0];
  if (!near(c)){
    const alt = r.filter(x => x.s >= r[0].s - .15 && near(x)).sort((x, y) => Math.abs(x.food.per.kcal - aiK100) - Math.abs(y.food.per.kcal - aiK100))[0];
    if (alt) c = alt;
  }
  return !(aiK100 > 0) || Math.abs(c.food.per.kcal - aiK100) <= Math.max(25, .35 * aiK100) ? c.food : null;
}
function ciqItem(food, g, nom){
  const it = { nom: nom || food.nom, g, kcal: food.per.kcal*g/100, p: food.per.p*g/100, c: food.per.c*g/100, f: food.per.f*g/100,
    src: { code: food.code, nom: food.nom, kcal: food.per.kcal } };
  setRatio(it); return it;
}
// repère interne pour le choix Ciqual (rien n'est affiché) : kcal ≈ 4 × protéines + 4 × glucides + 9 × lipides
const atwater = it => 4*it.p + 4*it.c + 9*it.f;
const incoherent = it => !it.src && !it.code && it.kcal > 20 && (it.p || it.c || it.f) && Math.abs(it.kcal - atwater(it)) > Math.max(20, .2 * it.kcal);

/* ---------- sélecteur d'aliment (Ciqual) ---------- */
let PK = null;   // sélecteur ouvert : { mode: "item" | "add", i }
function openPicker(mode, i){
  if (PK) return;
  PK = { mode, i };
  const it = mode === "item" ? draft.items[i] : null;
  document.body.insertAdjacentHTML("beforeend", `<div class="sheet-bg" id="pkbg"></div>
    <div class="sheet" id="picker" role="dialog" aria-modal="true" aria-label="${mode === "item" ? "Choisir l'aliment" : "Ajouter un aliment"}">
      <div class="sheet-h"><b>${mode === "item" ? "Choisir l'aliment" : "Ajouter un aliment"}</b><button class="rmbtn" id="pkclose" aria-label="Fermer">${XI}</button></div>
      <input type="search" id="pkq" enterkeyhint="search" autocomplete="off" placeholder="Rechercher, ex. riz cuit, filet de poulet" value="${esc(it ? (it.src ? it.src.nom : it.nom) : "")}">
      <div class="pklist" id="pklist"><div class="muted small">Chargement de la table Ciqual…</div></div>
      ${mode === "item" ? `<button class="btn ghost" id="pkkeep">Garder les valeurs actuelles</button>`
        : `<button class="btn ghost" id="pkfree">${PEN}Saisir à la main</button>`}
      <div class="muted small" style="text-align:center">Valeurs pour 100 g : table Ciqual 2025, Anses.</div>
    </div>`);
  document.body.classList.add("noscroll");
  history.pushState({ sheet:true }, "");
  $("#pkbg").addEventListener("click", () => closePicker());
  $("#pkclose").addEventListener("click", () => closePicker());
  let t; $("#pkq").addEventListener("input", () => { clearTimeout(t); t = setTimeout(pkRender, 120); });
  $("#pklist").addEventListener("click", e => {
    const b = e.target.closest("[data-code]"); if (!b || !PK) return;
    const food = CIQ.find(x => x.code === +b.dataset.code); if (!food) return;
    if (PK.mode === "item"){
      const cur = draft.items[PK.i];
      draft.items[PK.i] = ciqItem(food, cur.g || 100, cur.nom.trim() || food.nom);
    } else draft.items.push(ciqItem(food, 100));
    const add = PK.mode === "add"; closePicker(); render();
    if (add) document.querySelector("#items .item:last-child")?.scrollIntoView({ behavior:"smooth", block:"center" });
  });
  on2("#pkkeep", () => closePicker());
  on2("#pkfree", () => { draft.items.push({ nom:"", g:0, kcal:0, p:0, c:0, f:0, ratio:null }); closePicker(); render(); });
  if (mode === "add") $("#pkq").focus();
  loadCiqual().then(() => { if (PK) pkRender(); }).catch(e => { const l = $("#pklist"); if (l) l.innerHTML = `<div class="err">${esc(e.message)}</div>`; });
}
const on2 = (sel, fn) => { const el = $(sel); if (el) el.addEventListener("click", fn); };
function pkRender(){
  const l = $("#pklist"); if (!l || !CIQ) return;
  const q = $("#pkq").value.trim();
  if (!q){ l.innerHTML = `<div class="muted small">Tape le nom d'un aliment : « riz cuit », « pomme », « emmental »…</div>`; return; }
  const res = searchCiqual(q, 30);
  l.innerHTML = res.length ? res.map(({ food }) => `<button class="pkrow" data-code="${food.code}"><b>${esc(food.nom)}</b>
      <span class="muted small num">${fmt(food.per.kcal)} kcal · P ${d1(food.per.p)} · G ${d1(food.per.c)} · L ${d1(food.per.f)}</span></button>`).join("")
    : `<div class="muted small">Aucun aliment trouvé. Essaie un mot plus simple, ex. « riz » ou « poulet grillé ».</div>`;
}
function closePicker(fromHistory){
  if (!PK) return;
  PK = null;
  $("#picker")?.remove(); $("#pkbg")?.remove(); document.body.classList.remove("noscroll");
  if (!fromHistory && history.state && history.state.sheet) history.back();
}
window.addEventListener("popstate", () => { if (PK) closePicker(true); });

/* ---------- history ---------- */
const kg1 = n => n.toLocaleString("fr-FR", { minimumFractionDigits:1, maximumFractionDigits:1 });
function histReadout(d){
  const t = dayTotals(d);
  const lbl = parseISO(d).toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
  return `<div><b>${esc(lbl)}</b><div class="muted small num">${t.kcal ? `${fmt(t.kcal)} kcal · P ${fmt(t.p)} · G ${fmt(t.c)} · L ${fmt(t.f)}` : "Rien de saisi"}</div></div>
    <button class="btn ghost sm" data-goto="${d}">Voir</button>`;
}
/* ---------- poids : tendance, rythme ---------- */
const DAY = 864e5, KCAL_KG = 7700;   // énergie d'1 kg de variation de poids corporel (approximation classique)
const dnum = s => Math.round(parseISO(s).getTime() / DAY);   // numéro de jour, insensible au changement d'heure
const avg = a => a.reduce((t, x) => t + x, 0) / a.length;
const weightSeries = () => [...S.weights].sort((a,b) => a.date.localeCompare(b.date));
// tendance lissée : moyenne mobile exponentielle à 10 % par jour, adaptée aux pesées irrégulières
function trendSeries(ws){
  let t = null, prev = 0;
  return ws.map(w => { const d = dnum(w.date);
    t = t === null ? w.kg : t + (1 - Math.pow(0.9, d - prev)) * (w.kg - t);
    prev = d; return { date:w.date, kg:w.kg, trend:t }; });
}
// pente en kg par jour (moindres carrés) sur des pesées
function slope(ws){
  if (ws.length < 2) return null;
  const xs = ws.map(w => dnum(w.date)), ys = ws.map(w => w.kg), mx = avg(xs), my = avg(ys);
  let n = 0, d = 0; xs.forEach((x, i) => { n += (x - mx) * (ys[i] - my); d += (x - mx) ** 2; });
  return d ? n / d : null;
}
// fenêtre de 28 jours : rythme de poids fiable dès 3 pesées sur au moins 10 jours
function weightStats(){
  const ws = weightSeries(); if (!ws.length) return null;
  const tr = trendSeries(ws), from = dnum(todayISO()) - 28;
  const recent = ws.filter(w => dnum(w.date) >= from);
  const span = recent.length ? dnum(recent[recent.length-1].date) - dnum(recent[0].date) : 0;
  const perDay = recent.length >= 3 && span >= 10 ? slope(recent) : null;
  return { ws, tr, last: tr[tr.length-1], perWeek: perDay === null ? null : perDay * 7 };
}
// rythmes en kg par semaine : jusqu'à 2 décimales (0,25 ne doit pas devenir 0,3)
const kg2 = n => n.toLocaleString("fr-FR", { minimumFractionDigits:1, maximumFractionDigits:2 });
const signed = (n, unit) => `${n > 0 ? "+" : n < 0 ? "−" : ""}${kg2(Math.abs(Math.round(n * 100) / 100))} ${unit}`;
let wPeriod = 90;   // période du graphique de poids, en jours (0 = tout)
function weightChartHTML(tr){
  const end = dnum(todayISO()), first = dnum(tr[0].date);
  const start = wPeriod ? Math.max(end - wPeriod, first) : first;   // pas de vide avant la première pesée
  const pts = tr.filter(p => dnum(p.date) >= start);
  if (pts.length < 2) return `<div class="muted small">Pas assez de pesées sur cette période.</div>`;
  const vals = pts.flatMap(p => [p.kg, p.trend]);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = Math.max(.3, (hi - lo) * .12); lo -= pad; hi += pad;
  const W = 340, H = 150, L = 34, x = d => L + (dnum(d) - start) / Math.max(1, end - start) * (W - L - 6), y = v => 8 + (hi - v) / (hi - lo) * (H - 16);
  const grid = [0, .5, 1].map(f => { const v = hi - f * (hi - lo), yy = y(v).toFixed(1);
    return `<line class="wgrid" x1="${L}" x2="${W}" y1="${yy}" y2="${yy}"/><text class="wlbl" x="${L - 5}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="end">${kg1(v)}</text>`; }).join("");
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.date).toFixed(1)} ${y(p.trend).toFixed(1)}`).join("");
  const dots = pts.map(p => `<circle class="wdot" cx="${x(p.date).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3.2"/>`).join("");
  const fmtD = n => new Date(n * DAY).toLocaleDateString("fr-FR", { day:"numeric", month:"short" });
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Poids : pesées et tendance lissée">${grid}${dots}<path class="wtrend" d="${line}"/></svg>
    <div class="wdates"><span>${fmtD(start)}</span><span>Aujourd'hui</span></div>`;
}

/* ---------- dépense réelle et objectif adaptatif ---------- */
// dépense = apports moyens − variation de poids × 7 700 kcal/kg, sur les 28 derniers jours (sans aujourd'hui)
const MIN_DAY_KCAL = 800;   // en dessous, la journée est jugée incomplète (repas oubliés) et ignorée
function energyStats(){
  const today = todayISO(), N = 28, from = dnum(today) - N;
  const intakes = []; for (let i = 1; i <= N; i++){ const k = dayTotals(shift(today, -i)).kcal; if (k >= MIN_DAY_KCAL) intakes.push(k); }
  const ws = weightSeries().filter(w => dnum(w.date) >= from);
  const span = ws.length ? dnum(ws[ws.length-1].date) - dnum(ws[0].date) : 0;
  const ready = intakes.length >= 10 && ws.length >= 4 && span >= 14;
  const intake = intakes.length ? avg(intakes) : 0, perDay = ws.length >= 2 ? slope(ws) : null;
  const tdee = ready && perDay !== null ? intake - perDay * KCAL_KG : null;
  return { ready, days: intakes.length, weighIns: ws.length, span, intake, perDay, tdee, plausible: tdee !== null && tdee >= 1200 && tdee <= 6000 };
}
const PLANS = [["loss","Perdre"],["keep","Maintenir"],["gain","Prendre"]];
function energyHTML(){
  const e = energyStats(), g = S.settings.goals, rate = S.settings.rate || 0;
  const mode = rate < 0 ? "loss" : rate > 0 ? "gain" : "keep", mag = Math.abs(rate) || .25;
  const plan = `<div class="seg" style="grid-template-columns:repeat(3,1fr)" role="radiogroup" aria-label="Ton objectif de poids">${PLANS.map(([k, l]) =>
      `<button type="button" role="radio" aria-checked="${k === mode}" data-plan="${k}">${l}</button>`).join("")}</div>
    ${mode === "keep" ? "" : `<div class="seg" style="grid-template-columns:repeat(2,1fr)" role="radiogroup" aria-label="Rythme visé">${[.25, .5].map(r =>
      `<button type="button" role="radio" aria-checked="${r === mag}" data-rate="${r}">${kg2(r)} kg / semaine</button>`).join("")}</div>`}`;
  let body;
  if (!e.ready){
    const need = [[e.days, 10, "jours de repas complets"], [e.weighIns, 4, "pesées"], [e.span, 14, "jours entre la 1re et la dernière pesée"]];
    body = `<div class="muted small">Il faut quelques semaines de données sur les 28 derniers jours :</div>
      <div class="needs">${need.map(([v, n, l]) => `<div class="need"><div class="small"><b class="num">${Math.min(v, n)}/${n}</b> ${l}</div>
        <div class="bar"><span style="width:${Math.min(100, v / n * 100)}%"></span></div></div>`).join("")}</div>
      <div class="muted small">Note tous tes repas et pèse-toi 2 fois par semaine, le matin à jeun.</div>`;
  } else if (!e.plausible){
    body = `<div class="err">Estimation incohérente (${fmt(e.tdee)} kcal/jour). Des repas manquent sans doute dans le journal : complète-les, ou attends quelques jours de plus.</div>`;
  } else {
    const target = Math.max(1200, Math.round((e.tdee + rate * KCAL_KG / 7) / 50) * 50), diff = target - g.kcal;
    const newC = Math.max(0, Math.round(g.c + diff / 4));
    body = `<div class="ebig"><span class="lbl">Dépense réelle estimée</span><b class="num">${fmt(e.tdee)}</b><span class="muted small">kcal par jour</span></div>
      <div class="muted small">Sur 4 semaines : ${fmt(e.intake)} kcal mangées en moyenne (${e.days} jours complets), poids ${signed(e.perDay * 7, "kg / semaine")}.</div>
      <div class="note">Pour ${rate ? `${rate > 0 ? "prendre" : "perdre"} ${kg2(Math.abs(rate))} kg par semaine` : "garder ton poids"} : <b class="num">${fmt(target)} kcal par jour</b>${Math.abs(diff) < 100 ? `. Ton objectif actuel (${fmt(g.kcal)} kcal) est bon.` : `, au lieu de ${fmt(g.kcal)}.`}</div>
      ${Math.abs(diff) >= 100 ? `<button class="btn" id="applytarget" data-kcal="${target}" data-c="${newC}">Appliquer ${fmt(target)} kcal</button>
        <div class="muted small" style="text-align:center">Protéines et lipides inchangés, glucides ${fmt(g.c)}&nbsp;→&nbsp;${fmt(newC)}&nbsp;g.</div>` : ""}`;
  }
  return `<section class="card" id="energy">
    <h2>Dépense et objectif</h2>
    ${plan}
    ${body}
    <div class="muted small">Calcul : apports moyens moins la variation de poids (7 700 kcal par kg). Les jours à moins de ${MIN_DAY_KCAL} kcal sont ignorés. Refais le point chaque semaine.</div>
  </section>`;
}
function historyHTML(){
  const g = S.settings.goals, today = todayISO(), sel = histSel || today;
  const days = []; for (let i = 13; i >= 0; i--) days.push(shift(today, -i));
  const tots = days.map(dayTotals);
  const max = Math.max(g.kcal*1.25, ...tots.map(t => t.kcal));
  let sumK = 0, sumP = 0, n = 0;
  tots.forEach((t, i) => { const back = 13 - i; if (t.kcal > 0 && back > 0 && back <= 7){ sumK += t.kcal; sumP += t.p; n++; } });
  const cols = days.map((d, i) => { const t = tots[i];
    return `<button class="col${t.kcal ? "" : " none"}${t.kcal > g.kcal*1.1 ? " over" : ""}${d === sel ? " sel" : ""}" data-day="${d}" aria-label="${esc(dayLabel(d))} : ${fmt(t.kcal)} kcal"><i${t.kcal ? ` style="height:${t.kcal/max*100}%"` : ""}></i></button>`; }).join("");
  const letters = days.map(d => `<span${d === today ? ` class="today"` : ""}>${parseISO(d).toLocaleDateString("fr-FR", { weekday:"narrow" })}</span>`).join("");
  const w = weightStats(), rate = S.settings.rate || 0;
  const pace = w && w.perWeek !== null
    ? `<div class="wpace"><span class="ratechip${Math.abs(w.perWeek) < .05 ? "" : w.perWeek > 0 ? " up" : " down"}">${Math.abs(w.perWeek) < .05 ? "Stable" : signed(w.perWeek, "kg / sem.")}</span>
        <span class="muted small">sur 4 semaines${rate ? ` · objectif ${signed(rate, "kg / sem.")}` : ""}</span></div>
      <div class="muted small">À ce rythme : <b class="num">${kg1(w.last.trend + w.perWeek * 4)} kg</b> dans 4 semaines.</div>`
    : w ? `<div class="muted small">Le rythme s'affiche dès 3 pesées sur au moins 10 jours.</div>` : "";
  const periods = [[30,"1 mois"],[90,"3 mois"],[0,"Tout"]];
  return `
  <div class="top"><div><div class="title">Historique</div><div class="sub">Tes tendances récentes</div></div></div>
  <section class="card">
    <h2>Moyenne des 7 derniers jours</h2>
    <div class="num" style="font-size:1.5rem;font-weight:700;letter-spacing:-.02em">${n ? `${fmt(sumK/n)} kcal · ${fmt(sumP/n)} g prot.` : "Pas encore assez de données"}</div>
    <div class="muted small">Calculée sur les jours complets renseignés, sans aujourd'hui.</div>
  </section>
  <section class="card">
    <h2>14 derniers jours</h2>
    <div class="hread" id="hread">${histReadout(sel)}</div>
    <div class="chartbox"><div class="chart">${cols}</div><div class="goalline" style="bottom:${g.kcal/max*100}%"></div></div>
    <div class="days">${letters}</div>
    <div class="muted small">Ligne pointillée : ton objectif de ${fmt(g.kcal)} kcal. Touche une barre pour le détail.</div>
  </section>
  <section class="card" id="weight">
    <h2>Poids</h2>
    ${w ? `<div class="wtop"><div><span class="lbl">Tendance</span><div class="wbig num">${kg1(w.last.trend)}<small> kg</small></div></div>
      <div class="small muted" style="text-align:right">Dernière pesée<br><b class="num" style="color:var(--ink)">${kg1(w.last.kg)} kg</b> · ${esc(dayLabel(w.last.date).toLowerCase())}</div></div>
      ${pace}
      ${w.ws.length > 1 ? `<div class="seg" style="grid-template-columns:repeat(3,1fr)" role="tablist" aria-label="Période">${periods.map(([p, l]) =>
        `<button role="tab" aria-selected="${p === wPeriod}" data-wperiod="${p}">${l}</button>`).join("")}</div>
      ${weightChartHTML(w.tr)}
      <div class="wlegend"><span><i class="lg-dot"></i>Pesées</span><span><i class="lg-line"></i>Tendance lissée</span></div>` : ""}` : ""}
    <div class="row2"><label class="f">Poids (kg)<input type="number" inputmode="decimal" step="0.1" id="wkg" placeholder="ex. 78.4"></label>
      <label class="f">Date<input type="date" id="wdate" max="${todayISO()}" value="${todayISO()}"></label></div>
    <button class="btn" id="wsave">Enregistrer la pesée</button>
    <div class="wlist">${w ? [...w.ws].reverse().slice(0, 6).map(x => `<div><span class="muted">${parseISO(x.date).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}</span>
      <span class="num">${kg1(x.kg)} kg<button class="wdel" data-wdel="${x.date}" aria-label="Supprimer la pesée du ${esc(dayLabel(x.date))}">${XI}</button></span></div>`).join("")
      : `<div class="muted small">Pèse-toi le matin à jeun, 1 à 2 fois par semaine : la tendance lissée gomme les variations d'un jour à l'autre (eau, repas).</div>`}</div>
  </section>
  ${energyHTML()}`;
}

/* ---------- sauvegarde ---------- */
// Pas de serveur : la sauvegarde est un fichier JSON que l'utilisateur range lui-même
// (menu de partage → Fichiers / iCloud Drive sur iPhone, Téléchargements puis Drive sur Android).
const BACKUP_DAYS = 7;          // rappel au-delà de 7 jours sans sauvegarde
const LS_QUOTA = 5e6;           // quota localStorage habituel, en caractères
function backupData(){
  const { apiKey, lastBackup, backupSnooze, ...settings } = S.settings;   // la clé API ne quitte jamais le téléphone
  return { app:"assiette", version:1, exported:new Date().toISOString(), settings, goals:S.settings.goals,
           meals:S.meals, weights:S.weights, favs:S.favs };
}
const backupAge = () => S.settings.lastBackup ? dnum(todayISO()) - dnum(S.settings.lastBackup) : null;
function backupDue(){
  if (S.meals.length < 3) return false;
  const age = backupAge();
  if (age !== null && age < BACKUP_DAYS) return false;
  return !(S.settings.backupSnooze && S.settings.backupSnooze > todayISO());
}
const ageTxt = age => age === null ? "Jamais sauvegardé" : age === 0 ? "Sauvegardé aujourd'hui" : `Dernière sauvegarde il y a ${age} jour${age > 1 ? "s" : ""}`;
function download(file){
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function backup(){
  const file = new File([JSON.stringify(backupData())], `assiette-${todayISO()}.json`, { type:"application/json" });
  let shared = false;
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:"Sauvegarde Assiette" }); shared = true; }
    catch(e){ if (e.name === "AbortError") return; }   // partage annulé : pas de sauvegarde ; autre erreur : téléchargement
  }
  if (!shared) download(file);
  S.settings.lastBackup = todayISO(); S.settings.backupSnooze = ""; save(); render();
  toast(shared ? "Sauvegarde envoyée." : "Fichier téléchargé : range-le dans Fichiers ou sur ton Drive.");
}
function storageUsed(){ try { return (localStorage.getItem(KEY) || "").length; } catch(e){ return 0; } }
const mo = n => (n / 1e6).toLocaleString("fr-FR", { maximumFractionDigits: n < 1e5 ? 2 : 1 }) + " Mo";

/* ---------- settings ---------- */
function settingsHTML(){
  const st = S.settings, g = st.goals, age = backupAge(), used = storageUsed();
  return `
  <div class="top"><div><div class="title">Réglages</div><div class="sub">Objectifs, IA et données</div></div></div>
  <section class="card">
    <h2>Objectifs quotidiens</h2>
    <div class="row">
      <label class="f">Calories (kcal)<input type="number" inputmode="numeric" id="g-kcal" value="${g.kcal}"></label>
      <label class="f">Protéines (g)<input type="number" inputmode="numeric" id="g-p" value="${g.p}"></label>
    </div>
    <div class="row">
      <label class="f">Glucides (g)<input type="number" inputmode="numeric" id="g-c" value="${g.c}"></label>
      <label class="f">Lipides (g)<input type="number" inputmode="numeric" id="g-f" value="${g.f}"></label>
    </div>
    <div class="muted small" id="gcheck"></div>
  </section>
  <section class="card">
    <h2>Modèle d'IA</h2>
    <div class="fl">Clé API
      <div class="pw"><input type="password" id="apikey" autocomplete="off" value="${esc(st.apiKey)}" placeholder="sk-…" aria-label="Clé API"><button type="button" class="btn ghost" id="showkey">Afficher</button></div></div>
    <div class="muted small">La clé reste sur ce téléphone. Crée-la sur platform.deepseek.com, section API keys.</div>
    <label class="f">Adresse de l'API<input type="url" id="baseurl" value="${esc(st.baseUrl)}"></label>
    <label class="f">Modèle<input type="text" id="model" value="${esc(st.model)}"></label>
    <div class="muted small">Par défaut : https://api.deepseek.com et deepseek-flash (DeepSeek V4.1 Flash). Tout service compatible OpenAI avec la vision fonctionne, par exemple OpenRouter.</div>
  </section>
  <button class="btn" id="savesettings">Enregistrer les réglages</button>
  <section class="card">
    <h2>Sauvegarde</h2>
    <div class="bstat${age === null || age >= BACKUP_DAYS ? " warn" : ""}"><div class="bic">${SHIELD}</div>
      <div><b>${ageTxt(age)}</b><div class="muted small">Tes données ne sont que sur ce téléphone.</div></div></div>
    <button class="btn" id="export">${SHARE}Sauvegarder maintenant</button>
    <label class="btn ghost" style="cursor:pointer" for="import">Restaurer une sauvegarde<input type="file" id="import" accept="application/json,.json" hidden></label>
    <div class="muted small">Sur iPhone, choisis « Enregistrer dans Fichiers » puis iCloud Drive. Sur Android, le fichier va dans Téléchargements : copie-le sur Google Drive. Restaurer ajoute ce qui manque sans rien effacer, et reprend les objectifs de la sauvegarde. La clé API n'est jamais incluse.</div>
  </section>
  <section class="card">
    <h2>Données sur ce téléphone</h2>
    <div class="small">${S.meals.length} repas, ${S.weights.length} pesée${S.weights.length > 1 ? "s" : ""}, ${S.favs.length} favori${S.favs.length > 1 ? "s" : ""}</div>
    <div class="fl">Espace utilisé
      <div class="bar${used / LS_QUOTA > .8 ? " over" : ""}"><span style="width:${Math.min(100, used / LS_QUOTA * 100)}%"></span></div>
      <span class="muted small">${mo(used)} sur environ 5 Mo${used / LS_QUOTA > .7 ? ". Retire les photos d'anciens repas pour libérer de la place." : "."}</span></div>
    <div class="muted small" id="persist" hidden></div>
    <div class="muted small">Sur iPhone, supprimer l'icône de l'écran d'accueil efface aussi ces données.</div>
    <button class="btn danger${armedDelete === "wipe" ? " armed" : ""}" id="wipe">${armedDelete === "wipe" ? "Toucher encore pour tout effacer" : "Tout effacer"}</button>
  </section>
  <div class="muted small" style="text-align:center;padding:0 8px">Données nutritionnelles : table Ciqual 2025 de l'Anses (Licence Ouverte 2.0) et Open Food Facts (licence ODbL).</div>`;
}
function goalCheck(){
  const v = k => num($("#g-"+k)?.value);
  const calc = v("p")*4 + v("c")*4 + v("f")*9;
  const el = $("#gcheck"); if (!el) return;
  el.textContent = `Tes macros font ${fmt(calc)} kcal (protéines et glucides 4 kcal/g, lipides 9 kcal/g).` + (Math.abs(calc - v("kcal")) > 150 ? " Écart notable avec l'objectif calorique." : "");
}

/* ---------- events ---------- */
function bind(){
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  // journal
  on("#prev","click", () => { curDate = shift(curDate,-1); armedDelete = null; render(); });
  on("#next","click", () => { if (curDate < todayISO()){ curDate = shift(curDate,1); armedDelete = null; render(); } });
  on("#today","click", () => { if (curDate !== todayISO()){ curDate = todayISO(); armedDelete = null; render(); } });
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  document.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
    openMeal = openMeal === b.dataset.toggle ? null : b.dataset.toggle; armedDelete = null; render();
  }));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.del;
    if (armedDelete !== id){ arm(id); render(); return; }
    S.meals = S.meals.filter(m => m.id !== id); armedDelete = null; if (openMeal === id) openMeal = null; save(); render(); toast("Repas supprimé");
  }));
  const mealOf = b => S.meals.find(m => m.id === b.dataset.edit || m.id === b.dataset.redo || m.id === b.dataset.fav);
  document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => editMeal(b.dataset.edit)));
  document.querySelectorAll("[data-redo]").forEach(b => b.addEventListener("click", () => {
    const m = mealOf(b); if (m) logCopies([{ ...m, type: defaultType() }], todayISO());
  }));
  document.querySelectorAll("[data-fav]").forEach(b => b.addEventListener("click", () => { const m = mealOf(b); if (m){ toggleFav(m); render(); } }));
  on("#copyday","click", () => logCopies(S.meals.filter(m => m.date === curDate), todayISO(), true));
  on("#copyyest","click", () => logCopies(S.meals.filter(m => m.date === shift(todayISO(), -1)), todayISO(), true));
  document.querySelectorAll("[data-delphoto]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.delphoto, key = "ph:" + id;
    if (armedDelete !== key){ arm(key); render(); return; }
    const m = S.meals.find(x => x.id === id); armedDelete = null;
    if (m){ m.thumb = null; save(); }
    render(); toast("Photo retirée");
  }));
  // add
  const onPhoto = async e => {
    const files = [...(e.target.files || [])]; if (!files.length) return;
    const room = MAXP - draft.photos.length;
    draft.error = "";
    if (files.length > room) toast(`${MAXP} photos maximum : ${files.length - room > 1 ? "les dernières sont ignorées" : "la dernière est ignorée"}.`);
    for (const file of files.slice(0, room)){
      try { const img = await loadImage(file);
        draft.photos.push({ full: toJpeg(img, 1280, 0.85, false), thumb: toJpeg(img, 160, 0.7, true) });
      } catch(err){ draft.error = err.message; }
    }
    render();
  };
  on("#photo","change", onPhoto);
  on("#photocam","change", onPhoto);
  document.querySelectorAll("[data-rmphoto]").forEach(b => b.addEventListener("click", () => {
    draft.photos.splice(+b.dataset.rmphoto, 1); draft.error = ""; render();
  }));
  on("#scan","click", openScanner);
  // repas rapides
  document.querySelectorAll("[data-qtab]").forEach(b => b.addEventListener("click", () => { quickTab = b.dataset.qtab; render(); }));
  document.querySelectorAll("[data-qlog]").forEach(b => b.addEventListener("click", () => {
    // type d'origine du repas, sauf si l'utilisateur a choisi un type sur cet écran
    const m = quickList(quickTab)[+b.dataset.qlog]; if (m) logCopies([{ ...m, type: draft.typeSet ? draft.type : m.type }], draft.date || curDate);
  }));
  document.querySelectorAll("[data-qload]").forEach(b => b.addEventListener("click", () => {
    const m = quickList(quickTab)[+b.dataset.qload]; if (m) loadIntoDraft(m);
  }));
  document.querySelectorAll("[data-qfav]").forEach(b => b.addEventListener("click", () => {
    const m = quickList(quickTab)[+b.dataset.qfav]; if (m){ toggleFav(m); render(); }
  }));
  document.querySelectorAll("[data-qprod]").forEach(b => b.addEventListener("click", () => {
    const pr = S.scanned[+b.dataset.qprod];
    if (pr && !draft.products.some(p => p.code === pr.code)){ draft.products.push({ ...pr, used:false }); render(); toast(`${pr.nom} ajouté au repas`); }
  }));
  // date et heure du repas
  on("#mdate","change", e => {
    if (!e.target.value) return;
    draft.date = e.target.value > todayISO() ? todayISO() : e.target.value; render();
  });
  on("#mtime","change", e => { if (e.target.value) draft.time = e.target.value; });
  on("#canceledit","click", () => { draft = newDraft(); go("journal"); });
  document.querySelectorAll("[data-rmprod]").forEach(b => b.addEventListener("click", () => {
    draft.products.splice(+b.dataset.rmprod, 1); render();
  }));
  // sans clé API : le produit devient directement un aliment (portion indiquée, sinon 100 g)
  document.querySelectorAll("[data-direct]").forEach(b => b.addEventListener("click", () => {
    const pr = draft.products.splice(+b.dataset.direct, 1)[0];
    const it = productItem(pr, pr.portion || 100); it.scan = true;
    draft.items.push(it); if (!draft.name.trim()) draft.name = pr.nom; render();
  }));
  on("#note","input", e => {
    draft.note = e.target.value;
    const b = $("#analyse"); if (b) b.disabled = !canAnalyse();
    const h = $("#ahint"); if (h) h.hidden = !!(draft.photos.length || draft.products.length || draft.note.trim());
  });
  document.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => {
    draft.type = b.dataset.type; draft.typeSet = true;
    document.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-checked", String(x === b)));
    const t = $("#mtime"); if (t && !draft.time) t.value = defaultTime(draft.date || curDate, draft.type);   // heure habituelle du type
  }));
  on("#deep","change", e => { S.settings.deep = e.target.checked; save(); });
  on("#analyse","click", analyse);
  on("#manual","click", () => openPicker("add"));
  on("#additem","click", () => openPicker("add"));
  // délégation : la ligne « origine » est remplacée sans re-rendu pendant la saisie
  on("#items","click", e => {
    const pk = e.target.closest("[data-pick]"); if (pk) openPicker("item", +pk.dataset.pick);
  });
  // question de l'IA : la réponse rejoint les précisions et relance l'analyse
  on("#askgo","click", () => {
    const a = $("#askin").value.trim(); if (!a){ $("#askin").focus(); return; }
    draft.note = (draft.note.trim() ? draft.note.trim() + "\n" : "") + draft.question + " " + a;
    draft.question = ""; analyse();
  });
  on("#askin","keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("#askgo").click(); } });
  on("#askno","click", () => { draft.question = ""; render(); });
  on("#reset","click", () => { draft = newDraft(); render(); });
  on("#mealname","input", e => draft.name = e.target.value);
  on("#savemeal","click", saveMeal);
  document.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { draft.items.splice(+b.dataset.rm, 1); render(); }));
  document.querySelectorAll("#items input[type=number]").forEach(inp => inp.addEventListener("focus", () => inp.select()));
  document.querySelectorAll("#items input").forEach(inp => inp.addEventListener("input", () => {
    const i = +inp.dataset.i, k = inp.dataset.k, it = draft.items[i];
    if (k === "nom"){ it.nom = inp.value; return; }
    const v = num(inp.value);
    if (k === "g"){
      it.g = v;
      if (it.ratio){ for (const m of ["kcal","p","c","f"]){ it[m] = it.ratio[m]*v; const el = document.getElementById(`it-${i}-${m}`); if (el) el.value = it[m] ? r0(it[m]*10)/10 : ""; } }
      else setRatio(it);
    } else {
      it[k] = v; setRatio(it);
      // une valeur modifiée à la main ne vient plus de Ciqual ni du code-barres
      if (it.src || it.code){ delete it.src; delete it.code; delete it.info; it.ai = false; const s = $("#src-" + i); if (s) s.outerHTML = srcHTML(it, i); }
    }
    $("#totals").innerHTML = totalsHTML();
    const sb = $("#savemeal"); if (sb) sb.disabled = !draft.items.length;
  }));
  // history
  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    histSel = b.dataset.day;
    document.querySelectorAll("[data-day]").forEach(x => x.classList.toggle("sel", x === b));
    $("#hread").innerHTML = histReadout(histSel);
  }));
  on("#hread","click", e => { const b = e.target.closest("[data-goto]"); if (b){ curDate = b.dataset.goto; go("journal"); } });
  on("#wsave","click", () => {
    const kg = num($("#wkg").value); if (!kg || kg < 25 || kg > 300){ toast("Entre un poids en kg, ex. 78.4"); return; }
    const d = $("#wdate").value || todayISO();
    if (d > todayISO()){ toast("Choisis aujourd'hui ou une date passée."); return; }
    const old = S.weights.find(w => w.date === d);
    S.weights = S.weights.filter(w => w.date !== d); S.weights.push({ date:d, kg });
    save(); render(); toast(old ? `Pesée du ${dayLabel(d).toLowerCase()} remplacée` : "Poids enregistré");
  });
  document.querySelectorAll("[data-wdel]").forEach(b => b.addEventListener("click", () => {
    const w = S.weights.find(x => x.date === b.dataset.wdel); if (!w) return;
    S.weights = S.weights.filter(x => x !== w); save(); render();
    toast("Pesée supprimée", { label:"Annuler", fn:() => { S.weights.push(w); save(); render(); } });
  }));
  document.querySelectorAll("[data-wperiod]").forEach(b => b.addEventListener("click", () => { wPeriod = +b.dataset.wperiod; render(); }));
  // objectif de poids : signe = sens, valeur = kg par semaine
  document.querySelectorAll("[data-plan]").forEach(b => b.addEventListener("click", () => {
    const mag = Math.abs(S.settings.rate || 0) || .25;
    S.settings.rate = b.dataset.plan === "keep" ? 0 : b.dataset.plan === "gain" ? mag : -mag; save(); render();
  }));
  document.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => {
    S.settings.rate = Math.sign(S.settings.rate || 1) * +b.dataset.rate; save(); render();
  }));
  on("#applytarget","click", e => {
    const g = S.settings.goals, before = { ...g };
    g.kcal = +e.currentTarget.dataset.kcal; g.c = +e.currentTarget.dataset.c;
    if (!save()){ Object.assign(g, before); return; }
    render();
    toast(`Objectif : ${fmt(g.kcal)} kcal par jour`, { label:"Annuler", fn:() => { Object.assign(S.settings.goals, before); save(); render(); } });
  });
  // settings
  ["kcal","p","c","f"].forEach(k => on("#g-"+k, "input", goalCheck)); goalCheck();
  on("#showkey","click", e => {
    const i = $("#apikey"), show = i.type === "password";
    i.type = show ? "text" : "password"; e.currentTarget.textContent = show ? "Masquer" : "Afficher";
  });
  on("#savesettings","click", () => {
    const st = S.settings;
    st.apiKey = $("#apikey").value.trim(); st.baseUrl = $("#baseurl").value.trim() || DEFAULTS.settings.baseUrl;
    st.model = $("#model").value.trim() || DEFAULTS.settings.model;
    for (const k of ["kcal","p","c","f"]){ const v = num($("#g-"+k).value); if (v) st.goals[k] = Math.round(v); }
    if (save()) toast("Réglages enregistrés");
    render();
  });
  on("#export","click", backup);
  on("#bkpnow","click", backup);
  on("#bkplater","click", () => { S.settings.backupSnooze = shift(todayISO(), 3); save(); render(); toast("Rappel dans 3 jours"); });
  const pe = $("#persist");
  if (pe && navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => {
    pe.textContent = p ? "Stockage protégé : le navigateur ne l'effacera pas pour gagner de la place."
                       : "Stockage non garanti : le navigateur peut l'effacer s'il manque de place. Sauvegarde régulièrement.";
    pe.hidden = false;
  }).catch(() => {});
  on("#import","change", async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    e.target.value = "";
    let j;
    try { j = JSON.parse(await file.text()); if (!Array.isArray(j.meals) || !Array.isArray(j.weights)) throw new Error(); }
    catch(err){ toast("Fichier non reconnu. Choisis une sauvegarde d'Assiette (.json)."); return; }
    const snap = JSON.stringify(S), n0 = { m:S.meals.length, w:S.weights.length, f:S.favs.length };
    {
      const ids = new Set(S.meals.map(m => m.id));
      S.meals = S.meals.concat(j.meals.filter(m => m && m.id && m.date && Array.isArray(m.items) && !ids.has(m.id)));
      const wd = new Set(S.weights.map(w => w.date));
      S.weights = S.weights.concat(j.weights.filter(w => w && w.date && num(w.kg) && !wd.has(w.date)));
      if (Array.isArray(j.favs)){
        const fs = new Set(S.favs.map(sig));
        S.favs = S.favs.concat(j.favs.filter(f => f && Array.isArray(f.items) && !fs.has(sig(f))));
      }
      if (j.goals) for (const k of ["kcal","p","c","f"]) if (num(j.goals[k])) S.settings.goals[k] = Math.round(num(j.goals[k]));
      // réglages de la sauvegarde, jamais la clé API
      const st = j.settings || {};
      if (typeof st.rate === "number" && Math.abs(st.rate) <= 1) S.settings.rate = st.rate;
      if (typeof st.deep === "boolean") S.settings.deep = st.deep;
      for (const k of ["baseUrl","model"]) if (typeof st[k] === "string" && st[k].trim()) S.settings[k] = st[k].trim();
    }
    if (!save()){ S = JSON.parse(snap); return; }
    render();
    const add = { m:S.meals.length - n0.m, w:S.weights.length - n0.w, f:S.favs.length - n0.f };
    toast(add.m + add.w + add.f ? `Restauré : ${add.m} repas, ${add.w} pesée${add.w > 1 ? "s" : ""}, ${add.f} favori${add.f > 1 ? "s" : ""}.`
      : "Rien de nouveau : tout était déjà sur ce téléphone. Réglages repris.");
  });
  on("#wipe","click", () => {
    if (armedDelete !== "wipe"){ arm("wipe"); render(); return; }
    S.meals = []; S.weights = []; S.favs = []; S.scanned = []; armedDelete = null; save(); render(); toast("Données effacées");
  });
}

// glisser à l'horizontale dans le journal : jour précédent / suivant
let sw = null;
document.addEventListener("touchstart", e => {
  const t = e.touches[0];
  sw = (view === "journal" && e.touches.length === 1 && t.clientX > 24 && t.clientX < innerWidth - 24) ? { x:t.clientX, y:t.clientY } : null;
}, { passive:true });
document.addEventListener("touchend", e => {
  if (!sw) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y; sw = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy)*2) return;
  if (dx > 0){ curDate = shift(curDate,-1); armedDelete = null; render(); }
  else if (curDate < todayISO()){ curDate = shift(curDate,1); armedDelete = null; render(); }
}, { passive:true });

render(); animateIn();
if (!S.settings.apiKey && !S.meals.length) toast("Commence par ajouter ta clé DeepSeek dans Réglages.");
</script>
</body>
</html>
